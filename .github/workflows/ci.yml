# The gate (private/plans/2026-10-15-security-performance-audit.md,
# Plan S3): cheapest first, every step on every push and pull request.
#
# The master ruleset requires backend, frontend and dco. backend and frontend
# are summaries of the jobs that do the work, which run side by side; a
# summary always reports, and fails unless every job under it passed (or was
# skipped because a pull request changed only documentation).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs these first: a release is gated like every merge.
  workflow_call:
  # Daily, for the accessibility check's slowest pass (the frontend job)
  # and the Dockerfile frontend's pin.
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Everything else gets a
# group of its own: GitHub drops a queued run that waits in a shared group,
# and a master commit or a release must never go unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only documentation skips the checks below;
  # docs.yml builds the site. Anything not on this list runs everything, and
  # so does every push, schedule and release. DESIGN.md isn't on it: a test
  # reads it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          # A pull request's checkout is its merge commit: the first parent
          # is the base, so the diff is exactly what the pull request changes.
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '^(docs/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|(README|CHANGELOG|CONTRIBUTING|ROADMAP|CODE_OF_CONDUCT|SECURITY|SUPPORT)\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  backend-test:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: backend
    # The Postgres-backed tests (internal/testdb) run against make test-db's
    # server; set here, they fail rather than skip when it doesn't answer.
    env:
      TOFT_TEST_DATABASE_URL: postgres://postgres:toft@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: start the test database (the image docker-compose.yml pins)
        run: make -C .. test-db
      - name: test
        run: go test -race ./...
      # The runner isn't root, so the step above skips this test. A skip here
      # fails: only a pass is accepted. As root in a container (the release
      # builder's image, backend/Dockerfile): the sandbox kills every process
      # of uid 65532's, which on the runner itself could be other containers'.
      - name: Nixpacks' sandbox on the panel's host (as root)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -v "$(go env GOMODCACHE):/go/pkg/mod:ro" -e GOPROXY=off -e TOFT_TEST_SANDBOX=1 \
            golang:1.26-alpine@sha256:30b1e546a9c7fa3b747c2bdba3a0c7bdf3a02ebb4c5b8405d2f948d7e8aac4ec \
            go test -run '^TestLocalNixpacksRunsInItsSandbox$' -v ./internal/docker/ | tee sandbox.log
          grep -q -- '--- PASS: TestLocalNixpacksRunsInItsSandbox' sandbox.log

  backend-checks:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: pinned images (install.sh pulls no floating tag)
        run: ../scripts/check-pinned-images-test.sh
      - name: truncation-safe installers (a cut-off curl | sh runs nothing)
        run: ../scripts/check-truncation-safe-test.sh
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg)"
      - name: vet
        run: go vet ./...
      - name: govulncheck (reachable advisories not in backend/.govulnignore fail)
        run: ../scripts/govulncheck.sh
      - name: Docker advisories (one moby published that backend/internal/advisory/known.go lacks fails)
        run: ../scripts/docker-advisories.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Only when the change can alter what it checks: the anonymous manifest
      # reads count against Docker Hub's pull limit. With no base to compare
      # (a new tag, a release, a force push) it runs.
      - name: catalog images (one a server can't pull anonymously, or without amd64 and arm64, fails; catalog-images.yml runs it daily)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null &&
            ! git diff --name-only "$BASE" HEAD -- internal/catalog internal/composespec cmd/catalog-images go.mod \
              ../scripts/check-catalog-images.sh ../.github/workflows/ci.yml | grep -q .; then
            echo "no change to the catalog or its check: skipped (catalog-images.yml checks it daily)"
            exit 0
          fi
          ../scripts/check-catalog-images.sh
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/...
      # The node agent (D-106) runs on servers, amd64 and arm64: it must
      # build for both and stay small (the panel streams it to each server).
      - name: build the agent for servers
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "/tmp/toft-agent-$arch" ./cmd/toft-agent
            size=$(stat -c %s "/tmp/toft-agent-$arch")
            echo "toft-agent linux/$arch: $size bytes"
            test "$size" -lt 25000000
          done

  # The frontend's checks, split across runners: lint and types, the unit
  # tests in two shards, the accessibility check in three (by page).
  frontend-checks:
    name: frontend-checks (${{ matrix.check }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Every shard finishes, so one run shows every failure.
      fail-fast: false
      matrix:
        include:
          - { check: lint, shard: "", timeout: 7 }
          - { check: test, shard: 1/2, timeout: 7 }
          - { check: test, shard: 2/2, timeout: 7 }
          - { check: a11y, shard: 1/3, timeout: 20 }
          - { check: a11y, shard: 2/3, timeout: 20 }
          - { check: a11y, shard: 3/3, timeout: 20 }
    defaults:
      run:
        working-directory: frontend
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # node_modules itself, keyed on the exact lockfile and Node: npm ci only
      # on a miss, saved straight after it, before any step can write there.
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - if: matrix.check == 'lint'
        run: npm run lint
      - if: matrix.check == 'lint'
        run: npm run lint:tokens
      - if: matrix.check == 'lint'
        run: npm run typecheck
      - if: matrix.check == 'lint'
        run: npm run api:types:check
      - name: npm audit (production dependencies, high and above)
        if: matrix.check == 'lint'
        run: npm audit --omit=dev --audit-level=high

      - if: matrix.check == 'test'
        run: npm test -- --shard="$SHARD"

      # As the release image: the API on the panel's own origin (D-62).
      - if: matrix.check == 'a11y'
        run: npm run build
      # A page that fails axe, in Graphite or Paper, fails the build; so does a
      # failed read drawn as empty (scripts/a11y-check). Failing each read alone
      # is most of the step's time: a release and the daily run only.
      - if: matrix.check == 'a11y'
        run: npx playwright install --with-deps chromium
      - if: matrix.check == 'a11y'
        env:
          EACH_READ: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '--each-read' || '' }}
        run: npm run a11y -- --shard="$SHARD" ${EACH_READ:+"$EACH_READ"}

  # The required checks. A job skipped counts only when the pull request
  # changed nothing but documentation; failed or cancelled never does.
  backend:
    needs: [changes, backend-test, backend-checks]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.changes.result }} ${{ needs.backend-test.result }} ${{ needs.backend-checks.result }}
        run: |
          echo "code changed: $CODE; results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] && continue
            [ "$r" = skipped ] && [ "$CODE" = false ] && continue
            echo "::error::a job under this check ended $r"
            exit 1
          done

  frontend:
    needs: [changes, frontend-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.changes.result }} ${{ needs.frontend-checks.result }}
        run: |
          echo "code changed: $CODE; results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] && continue
            [ "$r" = skipped ] && [ "$CODE" = false ] && continue
            echo "::error::a job under this check ended $r"
            exit 1
          done

  # Daily only: a new docker/dockerfile release fails this run, never a
  # push that has nothing to do with it.
  dockerfile-frontend:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfile frontend (docker/dockerfile:1 newer than the pin in backend/internal/docker/buildkit.go fails)
        run: scripts/dockerfile-frontend.sh

  # Every commit of a pull request is signed off (DCO, CONTRIBUTING.md).
  # Dependabot signs its commits off too.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list --no-merges "$BASE..$HEAD") || exit 1
          fail=0
          for c in $commits; do
            git show -s --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+>$' && continue
            echo "::error::$(git show -s --format='%h %s' "$c") is not signed off: git rebase --signoff $BASE"
            fail=1
          done
          exit $fail
