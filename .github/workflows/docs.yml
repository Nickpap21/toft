# The docs site (D-127): built on every change to it, with its internal
# links checked (starlight-links-validator fails the build), and published to
# GitHub Pages from master. Pages needs a public repository on a free
# account, so until launch the deploy job is skipped and this is a check.
name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - CHANGELOG.md
      - ROADMAP.md
      - backend/api/openapi.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - ROADMAP.md
      - backend/api/openapi.yaml
      - .github/workflows/docs.yml
  # A deploy by hand: the public repository's first push may not match the
  # paths above (LAUNCH.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deploy halfway: only pull requests' runs give way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
