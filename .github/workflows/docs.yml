# The docs site (D-127): built on every change to it, with its internal
# links checked (starlight-links-validator fails the build), and published to
# GitHub Pages from master. Pages needs a public repository on a free
# account, so until launch the deploy job is skipped and this is a check.
name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - CHANGELOG.md
      - ROADMAP.md
      - backend/api/openapi.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - ROADMAP.md
      - backend/api/openapi.yaml
      - .github/workflows/docs.yml
  # A deploy by hand: the public repository's first push may not match the
  # paths above (LAUNCH.md).
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deploy halfway: only pull requests' runs give way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: npm audit (high and above)
        # One dated exception: picomatch's ReDoS,
        # https://github.com/advisories/GHSA-fc5q-39xc-vjpf (high, <= 4.0.7,
        # no fixed release on 2026-11-18). It runs only while the site
        # builds, through astro, starlight, vite and tinyglobby, on the
        # site's own globs. After EXCEPT_UNTIL it fails the audit again.
        # Any other high or critical advisory fails it, and so does an
        # audit that returns no report.
        env:
          EXCEPT_ID: GHSA-fc5q-39xc-vjpf
          EXCEPT_UNTIL: "2026-12-18"
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          jq -e '.vulnerabilities | type == "object"' "$RUNNER_TEMP/audit.json" > /dev/null || { echo "npm audit returned no report"; exit 1; }
          excepted=""
          if [[ "$(date -u +%F)" < "$EXCEPT_UNTIL" || "$(date -u +%F)" == "$EXCEPT_UNTIL" ]]; then excepted="$EXCEPT_ID"; fi
          left=$(jq -r --arg id "$excepted" '[.vulnerabilities[].via[] | objects
            | select(.severity == "high" or .severity == "critical")
            | select($id == "" or (.url | endswith("/" + $id) | not))
            | "\(.severity) \(.name): \(.title) \(.url)"] | unique | .[]' "$RUNNER_TEMP/audit.json") || exit 1
          if [ -n "$left" ]; then echo "$left"; exit 1; fi
          if [ -n "$excepted" ]; then echo "excepted until $EXCEPT_UNTIL: $EXCEPT_ID"; fi
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
