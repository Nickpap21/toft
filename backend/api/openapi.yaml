        project_id:
          type: string
        project_name:
          type: string
        environment_name:
          type: string
        fired_at:
          format: date-time
          type: string
    LiveDeploy:
      type: object
      required: [id, status, service_id, service_name, source_type, has_compose_repo, project_id, project_name, environment_name, server_name, commit_sha, created_at]
      properties:
        id:
          type: string
        status:
          type: string
        service_id:
          type: string
        service_name:
          type: string
        source_type:
          type: string
        has_compose_repo:
          type: boolean
        project_id:
          type: string
        project_name:
          type: string
        environment_name:
          type: string
        server_name:
          type: string
        commit_sha:
          type: string
        created_at:
          format: date-time
          type: string
    ProjectDeploy:
      type: object
      required: [project_id, status, service_name, source_type, git_branch, docker_image, created_at]
      properties:
        project_id:
          type: string
        status:
          type: string
        service_name:
          type: string
        source_type:
          type: string
        git_branch:
          type: string
        docker_image:
          type: string
        created_at:
          format: date-time
          type: string
    DashboardRecentDeployment:
      type: object
      required: [id, status, service_id, service_name, project_id, project_name, environment_name, created_at, finished_at]
      properties:
        id:
          type: string
        status:
          type: string
        service_id:
          type: string
        service_name:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        environment_name:
          type: string
        created_at:
          format: date-time
          type: string
        finished_at:
          format: date-time
          type: string
          nullable: true
    DashboardData:
      type: object
      required: [deploys_24h, failed_deploys, open_alerts, deploying, project_deploys, recent_deployments, work, activity]
      properties:
        work:
          $ref: '#/components/schemas/DashboardWork'
        activity:
          type: array
          description: Issues opened and shipped, pull requests merged and pages edited, newest first (D-88).
          items:
            $ref: '#/components/schemas/DashboardActivity'

        deploys_24h:
          $ref: '#/components/schemas/Deploys24h'
        failed_deploys:
          items:
            $ref: '#/components/schemas/FailedDeploy'
          type: array
        open_alerts:
          items:
            $ref: '#/components/schemas/OpenAlert'
          type: array
        deploying:
          items:
            $ref: '#/components/schemas/LiveDeploy'
          type: array
        project_deploys:
          items:
            $ref: '#/components/schemas/ProjectDeploy'
          type: array
        recent_deployments:
          items:
            $ref: '#/components/schemas/DashboardRecentDeployment'
          type: array
    TagEntry:
      type: object
      required: [name, pushed_at, digest, is_latest]
      properties:
        name:
          type: string
        pushed_at:
          format: date-time
          type: string
        digest:
          type: string
        is_latest:
          type: boolean
    CommitInfo:
      type: object
      required: [sha, message, author, timestamp]
      properties:
        sha:
          type: string
        message:
          type: string
        author:
          type: string
        timestamp:
          format: date-time
          type: string
    BranchInfo:
      type: object
      required: [name, latest_commit]
      properties:
        name:
          type: string
        latest_commit:
          $ref: '#/components/schemas/CommitInfo'
    TagInfo:
      type: object
      required: [name, sha]
      properties:
        name:
          type: string
        sha:
          type: string
        date:
          format: date-time
          type: string
          nullable: true
    VersionInfo:
      type: object
      required: [source_type, is_outdated]
      properties:
        source_type:
          type: string
        current_image:
          type: string
        is_outdated:
          type: boolean
        latest_tag:
          type: string
        tags:
          items:
            $ref: '#/components/schemas/TagEntry'
          type: array
        registry_error:
          type: string
        current_branch:
          type: string
        latest_commit:
          allOf:
            - $ref: '#/components/schemas/CommitInfo'
          nullable: true
        branches:
          items:
            $ref: '#/components/schemas/BranchInfo'
          type: array
        git_tags:
          items:
            $ref: '#/components/schemas/TagInfo'
          type: array
        scm_error:
          type: string
    GitHubPushPayload:
      additionalProperties: true
      description: The sender's own shape; not modelled here.
      type: object
    MessageOnly:
      type: object
      required: [message]
      properties:
        message:
          type: string
    WebhookInfo:
      type: object
      required: [url, secret, last_push_at, last_push_repo]
      properties:
        url:
          type: string
        secret:
          type: string
        last_push_at:
          type: string
          format: date-time
          nullable: true
          description: The last signed branch push GitHub delivered; null before the first.
        last_push_repo:
          type: string
          description: That push's repository, as owner/name; empty before the first.
    ProjectAPIKey:
      type: object
      required: [id, name, prefix, scopes, owner_id, owner_name, last_used_at, created_at, expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        owner_id:
          type: string
        owner_name:
          type: string
          description: The member's name, or their email without one.
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    EnvvarUpsertInput:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 32768
        masked:
          type: boolean
# The MCP tools (D-18, D-100): each follows a task, not an endpoint. A tool
# names the operations it runs, and each input points at an operation's
# field (operationId#path.name, #query.name or #body.name), whose schema
# becomes the tool's; an input with no operation field carries its own
# schema. scope is the agent scope the tool needs; policy, the policy row
# that gates it. An input marked secret: true (set_secret's value) is
# never recorded, in the audit log or anywhere else. internal/mcp builds
# the tools from this list, and
# TestToolsMatchSpec fails when it and the code drift. Never exposed:
# read_secret, change_roles, delete_org, remove_server.
x-toft-tools:
  - name: list_projects
    description: "The projects this connection reaches, each with its services and the environment each is in: IDs, names, status, source and server. Start here: the other tools take these IDs."
    scope: read
    operations: [getProjects, getWorkspaceServices]
    input: {}
  - name: get_service
    description: "One service: its source, settings, status, domains and isolation, with its last 10 deployments."
    scope: read
    operations: [getServicesServiceid, getServicesServiceidDeployments, getServicesServiceidDomains]
    input:
      service_id: {from: "getServicesServiceid#path.serviceID", required: true}
  - name: get_deploy_logs
    description: "A deployment's status and the last lines of its log. Without deployment_id, the service's latest deployment."
    scope: read
    operations: [getServicesServiceidDeployments, getServicesServiceidDeploymentsDeploymentid, getServicesServiceidDeploymentsDeploymentidLogs]
    input:
      service_id: {from: "getServicesServiceidDeploymentsDeploymentidLogs#path.serviceID", required: true}
      deployment_id: {from: "getServicesServiceidDeploymentsDeploymentidLogs#path.deploymentID"}
      search: {from: "getServicesServiceidDeploymentsDeploymentidLogs#query.search"}
      lines:
        schema: {type: integer, minimum: 1, maximum: 1000, default: 200, description: "How many of the log's last lines."}
  - name: get_capacity
    description: "Each server's capacity: what it has, what is allocated, and to which workspaces and projects. With server_id, that server only."
    scope: read
    operations: [getServers, getServersServeridCapacitySummary]
    input:
      server_id: {from: "getServersServeridCapacitySummary#path.serverID"}
  - name: search_docs
    description: "Search the docs pages (runbooks, notes) of the projects this connection reaches, by title and text. With project_id and page_id, read one page's markdown."
    scope: read
    operations: [searchWorkspace, getDocPage]
    input:
      query: {from: "searchWorkspace#query.q"}
      project_id: {from: "getDocPage#path.projectID"}
      page_id: {from: "getDocPage#path.pageID"}
  - name: get_issue
    description: "An issue: title, description, status, priority, assignee, cycle and what links to it. An issue's key reads <KEY>-<number>: give its project and number."
    scope: read
    operations: [getIssue]
    input:
      project_id: {from: "getIssue#path.projectID", required: true}
      issue_number: {from: "getIssue#path.issueNumber", required: true}
  - name: get_diff
    description: "A diff in one of a project's repositories: a pull request's (pull_number), a commit's (sha), or between two branches (base and head). repository_id defaults to the project's first repository."
    scope: read
    operations: [getProjectsProjectidRepositories, getPullRequestDiff, getRepositoryCommitDiff, compareBranchesDiff]
    input:
      project_id: {from: "getPullRequestDiff#path.projectID", required: true}
      repository_id: {from: "getPullRequestDiff#path.repositoryID"}
      pull_number: {from: "getPullRequestDiff#path.pullNumber"}
      sha: {from: "getRepositoryCommitDiff#path.sha"}
      base: {from: "compareBranchesDiff#query.base"}
      head: {from: "compareBranchesDiff#query.head"}
  - name: deploy
    description: "Deploy a service, under the workspace's agent policy: it may run at once, wait for a person to approve it (give a reason and a plan they can judge), or be refused. By default the call waits for the deploy and returns its outcome with the last log lines; wait false returns once it starts."
    scope: deploy
    policy: deploy
    operations: [postServicesServiceidDeployments, getServicesServiceidDeploymentsDeploymentid, getServicesServiceidDeploymentsDeploymentidLogs]
    input:
      service_id: {from: "postServicesServiceidDeployments#path.serviceID", required: true}
      git_ref: {from: "postServicesServiceidDeployments#body.git_ref"}
      git_ref_type: {from: "postServicesServiceidDeployments#body.git_ref_type"}
      commit_sha: {from: "postServicesServiceidDeployments#body.commit_sha"}
      image_tag: {from: "postServicesServiceidDeployments#body.image_tag"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why: what this changes and how you checked it. A person reads it when the policy asks them."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What you will do after: what you watch, and when you roll back."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
      wait:
        schema: {type: boolean, default: true, description: "Wait for the outcome (up to 20 minutes)."}
  - name: rollback
    description: "Roll a service back to an earlier deployment (by default the last one that ran before the current), under the workspace's agent policy, as deploy is. By default the call waits for the outcome."
    scope: deploy
    policy: deploy
    operations: [getServicesServiceidDeployments, postServicesServiceidDeploymentsDeploymentidRollback, getServicesServiceidDeploymentsDeploymentid, getServicesServiceidDeploymentsDeploymentidLogs]
    input:
      service_id: {from: "postServicesServiceidDeploymentsDeploymentidRollback#path.serviceID", required: true}
      deployment_id: {from: "postServicesServiceidDeploymentsDeploymentidRollback#path.deploymentID"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why: what went wrong and why this deployment is the one to go back to."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What you will do after."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
      wait:
        schema: {type: boolean, default: true, description: "Wait for the outcome (up to 20 minutes)."}
  - name: create_branch
    description: "Make a branch in one of a project's repositories (from: a branch, tag or commit; the default branch when empty) and get a password that pushes to that branch alone over HTTPS, for 24 hours: push your work there, then open_pr. Name it agent/<what>. Calling it again on your own branch gives a new password. It never makes a branch a service deploys from, and you can't push to any other branch. Under the agent policy's code row."
    scope: code
    policy: code
    operations: [getProjectsProjectidRepositories, createBranch]
    input:
      project_id: {from: "createBranch#path.projectID", required: true}
      repository_id: {from: "createBranch#path.repositoryID"}
      name: {from: "createBranch#body.name", required: true}
      from: {from: "createBranch#body.from"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why: what the branch is for. A person reads it when the policy asks them."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What you will push, and when you open the pull request."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: open_pr
    description: "Open a pull request from head (a branch, usually one create_branch made) into base (the default branch when empty). Its preview, if the project has previews, waits for a person to approve each commit and runs Sandboxed with no secrets. Under the agent policy's code row; a person merges it."
    scope: code
    policy: code
    operations: [getProjectsProjectidRepositories, getRepository, openPullRequest]
    input:
      project_id: {from: "openPullRequest#path.projectID", required: true}
      repository_id: {from: "openPullRequest#path.repositoryID"}
      head: {from: "openPullRequest#body.head", required: true}
      base: {from: "openPullRequest#body.base"}
      title: {from: "openPullRequest#body.title", required: true}
      body: {from: "openPullRequest#body.body"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why: what the change does and how you checked it."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What happens next: tests, the preview, who reviews."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: create_issue
    description: "Open an issue in a project: a title, a description in markdown, and optionally a priority, labels and a type. Agents don't assign people or put issues in cycles. Under the agent policy's issues row; at most 20 an hour."
    scope: issues
    policy: issues
    operations: [createIssue]
    input:
      project_id: {from: "createIssue#path.projectID", required: true}
      title: {from: "createIssue#body.title", required: true}
      description: {from: "createIssue#body.description"}
      priority: {from: "createIssue#body.priority"}
      labels: {from: "createIssue#body.labels"}
      type_id: {from: "createIssue#body.type_id"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why this issue, when the policy asks a person."}
      plan:
        schema: {type: string, maxLength: 4000}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: comment
    description: "Comment on an issue (issue_number) or a pull request (pull_number; repository_id defaults to the project's first repository), in markdown. @mentions notify people. Under the agent policy's issues row; at most 60 an hour."
    scope: issues
    policy: issues
    operations: [addIssueComment, getProjectsProjectidRepositories, addPullRequestComment]
    input:
      project_id: {from: "addIssueComment#path.projectID", required: true}
      issue_number: {from: "addIssueComment#path.issueNumber"}
      pull_number: {from: "addPullRequestComment#path.pullNumber"}
      repository_id: {from: "addPullRequestComment#path.repositoryID"}
      body: {from: "addIssueComment#body.body", required: true}
      reason:
        schema: {type: string, maxLength: 2000}
      plan:
        schema: {type: string, maxLength: 4000}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: set_env_var
    description: "Set one plain variable of a service (service_id) or of an environment (environment_id), which its services read at their next deploy. Never deletes or replaces the others. Under the agent policy's variables row: a database or cache counts as protected."
    scope: variables
    policy: variables
    operations: [postServicesServiceidEnvVars, postEnvironmentsEnvironmentidEnvVars]
    input:
      service_id: {from: "postServicesServiceidEnvVars#path.serviceID"}
      environment_id: {from: "postEnvironmentsEnvironmentidEnvVars#path.environmentID"}
      key: {from: "postServicesServiceidEnvVars#body.key", required: true}
      value: {from: "postServicesServiceidEnvVars#body.value", required: true}
      masked: {from: "postServicesServiceidEnvVars#body.masked"}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why this value. A person reads it when the policy asks them."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What you will do after: usually deploy."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: set_secret
    description: "Set a secret of a service (service_id) or an environment (environment_id): a new one, or a new value for one that exists. Nobody can read a secret back, you included, and a person approving it never sees the value. It takes effect at the next deploy. Under the agent policy's secrets row."
    scope: variables
    policy: secrets
    operations: [getServicesServiceidSecrets, postServicesServiceidSecrets, putServicesServiceidSecretsKey, getEnvironmentsEnvironmentidSecrets, postEnvironmentsEnvironmentidSecrets, putEnvironmentsEnvironmentidSecretsKey]
    input:
      service_id: {from: "postServicesServiceidSecrets#path.serviceID"}
      environment_id: {from: "postEnvironmentsEnvironmentidSecrets#path.environmentID"}
      key: {from: "postServicesServiceidSecrets#body.key", required: true}
      value: {from: "postServicesServiceidSecrets#body.value", required: true, secret: true}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why this secret changes. A person reads it; they never see the value."}
      plan:
        schema: {type: string, maxLength: 4000}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: run_runbook_step
    description: "Run one command of a docs page (a runbook), as the page has it now: step is the command's place among the page's commands, counting from 1 as the page does (search_docs with page_id shows them; the first is 1). It runs in its service's container, never on a server's host, for at most 10 minutes, and returns the output's last lines. Under the agent policy's runbooks row."
    scope: runbooks
    policy: runbooks
    operations: [getDocPage, runDocStep]
    input:
      project_id: {from: "runDocStep#path.projectID", required: true}
      page_id: {from: "runDocStep#path.pageID", required: true}
      step:
        required: true
        schema: {type: integer, minimum: 1, maximum: 1000, description: "The command's place among the page's commands, from 1: the first command on the page is 1."}
      reason:
        schema: {type: string, maxLength: 2000, description: "Why run it now: what you saw."}
      plan:
        schema: {type: string, maxLength: 4000, description: "What you check after it runs, and what you do if it fails."}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
  - name: create_preview
    description: "Start a pull request's preview (or start a stopped one again), when the project has previews. A pull request an agent opened runs Sandboxed and waits for a person to approve each commit. Under the agent policy's deploy row, Previews."
    scope: deploy
    policy: deploy
    operations: [getProjectsProjectidRepositories, startPullRequestPreview]
    input:
      project_id: {from: "startPullRequestPreview#path.projectID", required: true}
      repository_id: {from: "startPullRequestPreview#path.repositoryID"}
      pull_number: {from: "startPullRequestPreview#path.pullNumber", required: true}
      reason:
        schema: {type: string, maxLength: 2000}
      plan:
        schema: {type: string, maxLength: 4000}
      plan_steps:
        schema: {type: array, maxItems: 20, description: "Optional: your plan as steps. Name the tool a step would call (and its service_id, by default this call's service), and the person who decides sees what each step needs: covered by this approval, or asks them again.", items: {type: object, additionalProperties: false, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 500}, tool: {type: string, maxLength: 64}, service_id: {type: string, maxLength: 64}}}}
