      - name: deploymentID
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Deployments]
      operationId: postServicesServiceidDeploymentsDeploymentidRollback
      summary: Deploy that deployment's version again
      description: "Runs that deployment's image again with the service's settings, variables, secrets and domains as they are now (a compose stack from a repository takes its compose files at that deployment's commit); no build. To the live deployment it is a redeploy, recorded as triggered_by \"Redeploy · <name>\" and audited as deployment.redeploy; to any other \"Rollback · <name>\", deployment.rollback. An agent's is recorded as the agent acting for its person, \"Redeploy · Agent · <agent> for <name>\" (D-100). Under the workspace's agent policy when an agent's token calls it (D-100): Ask answers 202 approval_pending with the request waiting in Needs you (from the MCP tool, which gives a reason), or 403 approval_required (without one); Never 403 agent_policy_never; 422 reason_required; 429 too_many_approvals. Ask doesn't ask again for the rollback a person's approval of this agent's deploy covers (D-146): to the deployment live before it, once, within 30 minutes of it going live, while it is still live and the approver is still an owner or developer. Like a deploy, it waits for a deploy of the service that is pending or building, and is refused 409 service_moving while the service moves to another server."
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Deployment'
                      - $ref: '#/components/schemas/AgentApprovalPending'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
