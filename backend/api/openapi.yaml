              $ref: '#/components/schemas/DiskPolicyInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskPolicy'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/gvisor:
    parameters:
      - name: serverID
        in: path
        required: true
