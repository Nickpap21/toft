    put:
      tags: [Instance]
      operationId: putInstanceWatchdog
      summary: Set the watchdog's ping URL, or turn it off with an empty one
      description: Operators only. An https:// URL on a public address (invalid_url otherwise); it is pinged at once, and every 5 minutes while the panel is healthy.
      responses:
        "200":
