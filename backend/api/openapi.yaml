      description: For a server no agent ever joined and that was never provisioned. It signs in as root (Toft 1.0 runs its install without sudo) at ip_address and port, with ssh_key or else the key POST …/ssh-key made, which is then forgotten if ssh_key replaces it. Toft signs in first and pins the host key the server presented (trust on first use, compared on the server's console next); 502 ssh_failed when it can't sign in, and the server keeps waiting. Its join commands stop working. 400 when no key is given and none was made; 409 server_joined.
