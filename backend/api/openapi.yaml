          # meet another enum's, so a schema added elsewhere renames them.
          x-enum-varnames: [ServiceKindDatabase, ServiceKindCache, ServiceKindTool, ServiceKindApp]
          description: "What the service is, for showing it: by its catalog entry, or else its image's name (postgres, mysql, mariadb, mongo; redis, valkey; pgAdmin, phpMyAdmin, Adminer, Mailpit, MailHog, RedisInsight). Display only: nothing behaves by it."
