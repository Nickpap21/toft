      summary: Read the panel's own server's updates again now; operators only
      description: Reads only, as a server's. A read that can't run keeps what the last one read, with its error.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/HostUpdates'
                required:
                  - data
