              description: The services that build from the base branch, with how many of the pull request's files each covers; merging deploys those with deploy_on_push (D-77).
              items:
                $ref: '#/components/schemas/DeployTarget'
            agent_branch:
              type: object
              description: "When its head branch is an agent's (create_branch, D-102), the agent, the person whose connection made it, and when the branch's push password stops working: its own expiry, or sooner when the connection expires or is revoked (in the past once it has; the agent asks again to push). Absent for a person's branch."
              required: [agent, person, password_expires_at]
              properties:
