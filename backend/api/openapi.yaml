  /api/v1/inbox/needs-you:
    get:
      tags: [Inbox]
      operationId: listNeedsYou
      summary: What needs the caller now, computed when asked
      description: "D-88. Failed deploys and open alerts for owners and developers; assigned urgent or high issues not yet started for their assignee; out-of-date pages for whoever wrote or edited them; a failed panel upgrade and an out-of-date recovery kit for instance operators. A release is not one (D-140): the sidebar's Instance chip says it. In severity order (problem, waiting, warning, request), newest first within one; the inbox's counts.needs_you is this list's length. Marking an event (deploy_failed, upgrade_failed, assigned, due, stale_page, preview_approval, agent_approval) done hides it while it holds; marking a condition, which stays true until its cause is fixed (no_backup, no_watchdog, kit_out_of_date, exposed_tool, setup_login, https_redeploy, alert), only puts it off for 7 days, after which it is back by itself. ?done=true lists those the caller marked done that still hold (a condition only while it is put off), ?done=any every item, marked or not, for screens that show state; any other value is 400 bad_input. Personal: project-scoped API keys are refused."
