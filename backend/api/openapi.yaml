        schema:
          type: string
    get:
      tags: [Variables and secrets]
      operationId: getServicesServiceidAdminPasswordValue
      summary: The caller's copy of the admin password, with its value
      description: 'D-160: only the person it was kept for, while an owner or developer, with a signed-in session and the password confirmed (X-Toft-Reauth; reauth_required without it, session_required for an API key or an agent). Audited without the value. 404 no_admin_password when there is none. Cache-Control: no-store.'
      responses:
        "200":
