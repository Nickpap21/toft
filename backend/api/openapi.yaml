  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: getServers
      summary: The workspace's servers, and the ones shared with it
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/ServerResponse'
                        - $ref: '#/components/schemas/SharedServerResponse'
                    type: array
                required:
                  - data
                type: object
          description: >-
            OK. The workspace's own servers first, then those other
            workspaces share with it (shared true, without an address).
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Servers]
      operationId: postServers
      summary: Add a server; owners
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ServerResponse'
                required:
                  - data
                type: object
          description: OK. With connection "agent", data also has join.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      description: 'With connection "agent" (D-106) the server joins by token: no SSH key, and the response carries join, the one-time command. Without a name (D-153) it reuses the caller''s own server that is still waiting for its first agent and was never provisioned, with a new command (older ones stop working), or makes one named server-<n>, a name the server''s hostname replaces when it first provisions. The first join provisions the server, requirements first, as the person who made the command. Without connection, or with "ssh", the panel signs in over SSH. A new name follows the rule in RenameServerInput: 400 invalid_server_name, 409 server_name_taken.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateServerInput'
                - $ref: '#/components/schemas/CreateAgentServerInput'
        required: true
