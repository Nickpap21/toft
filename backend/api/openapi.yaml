    Mirror:
      type: object
      description: "A repository's pull mirror (what an import is) or push mirror (D-79)."
      required: [id, direction, url, username, has_password, keep, state, created_at, created_by, syncing_since, last_sync_at, last_ok_at, next_sync_at, failures, error, last_moved, remote]
      properties:
        id:
          type: string
        direction:
          type: string
          enum: [pull, push]
        url:
          type: string
        username:
          type: string
          description: Empty when none is stored.
        has_password:
          type: boolean
          description: A token or password is stored, encrypted; it is never returned.
        keep:
          type: boolean
          description: "A pull mirror keeps pulling every 10 minutes after its import; without it, it goes once the import succeeds. Always true for a push mirror."
        state:
          type: string
          enum: [importing, failed, pending, syncing, ok, failing]
          description: "importing: a pull mirror whose first sync, the import, waits or runs. failed: that import failed, and waits for Sync now or another import. pending: a push mirror that hasn't pushed yet. syncing: a sync runs. ok: the last sync succeeded. failing: the last sync failed, and the next is at next_sync_at."
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/Person'
          nullable: true
        syncing_since:
          type: string
          format: date-time
          nullable: true
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: When the last sync ended, well or not.
        last_ok_at:
          type: string
          format: date-time
          nullable: true
        next_sync_at:
          type: string
          format: date-time
          nullable: true
        failures:
          type: integer
          description: Failed syncs in a row.
        error:
          type: string
          nullable: true
          description: Why the last sync failed, in words.
        last_moved:
          type: integer
          nullable: true
          description: How many branches and tags the last successful sync created, moved or deleted.
        remote:
          $ref: '#/components/schemas/MirrorRemote'
          nullable: true
