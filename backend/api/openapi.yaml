  /api/v1/oauth/register:
    post:
      tags: [Agents]
      operationId: registerOAuthClient
      summary: Register a public client (RFC 7591)
      description: "redirect_uris must be https, or http to localhost; token_endpoint_auth_method none. Not enveloped; errors are OAuth's ({error, error_description}). A registration no one signs in with is removed after a day. 30 a minute per address. The instance holds at most 1,000 registrations no one has signed in with (a connected client never counts); past that, 429 temporarily_unavailable with Retry-After until the daily clean-up frees room. A Client ID Metadata Document needs no registration."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegistration'
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientInformation'
        "400":
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "429":
          description: "Past the per-address limit (a problem, which carries error too) or the instance's unused registrations (temporarily_unavailable). Either way with Retry-After."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /api/v1/oauth/token:
    post:
      tags: [Agents]
      operationId: oauthToken
      summary: Exchange a code, or refresh (RFC 6749)
      description: "authorization_code with code_verifier (PKCE S256), or refresh_token, which rotates: a refresh token used twice revokes its connection. Access tokens last an hour; the connection 90 days. Not enveloped; errors are OAuth's."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
        "400":
          description: An OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "429":
          $ref: '#/components/responses/Problem'
  /api/v1/oauth/revoke:
    post:
      tags: [Agents]
      operationId: oauthRevoke
      summary: Revoke a token (RFC 7009)
      description: A refresh token ends its connection; an access token, itself. Unknown tokens answer 200 too.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        "200":
          description: Revoked, or nothing to revoke.
        "429":
          $ref: '#/components/responses/Problem'
  /api/v1/oauth/authorize/request:
    get:
      tags: [Agents]
      operationId: getOAuthAuthorizeRequest
      summary: Check an authorization request, for the consent screen
      description: "A person signed in (403 session_required for an agent or a key). 400 with OAuth's code (invalid_client, invalid_request, unsupported_response_type, invalid_target) when the link doesn't work."
      security:
        - session: []
      parameters:
        - {name: response_type, in: query, schema: {type: string}}
        - {name: client_id, in: query, schema: {type: string}}
        - {name: redirect_uri, in: query, schema: {type: string}}
        - {name: code_challenge, in: query, schema: {type: string}}
        - {name: code_challenge_method, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string}}
        - {name: resource, in: query, schema: {type: string}}
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentClientView'
                required: [data]
                type: object
          description: Who asks.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/oauth/authorize:
    post:
      tags: [Agents]
      operationId: postOAuthAuthorize
      summary: The person's answer on the consent screen
      description: "A person signed in. Allow: a member of org_id; viewers may let an agent read only (400 invalid_input). Answers the address the browser goes back to, with a code (10 minutes, once) or error=access_denied."
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConsentInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    required: [redirect_to]
                    properties:
                      redirect_to:
                        type: string
                required: [data]
                type: object
          description: Where the browser goes.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/connections:
    get:
      tags: [Agents]
      operationId: listAgentConnections
      summary: Connected agents
      description: Live connections (not revoked or expired), newest first. Owners see every one in the workspace; others, their own.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AgentConnection'
                    type: array
                required: [data]
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/connections/{connectionID}:
    parameters:
      - {name: connectionID, in: path, required: true, schema: {type: string}}
    delete:
      tags: [Agents]
      operationId: revokeAgentConnection
      summary: Revoke an agent
      description: "Its owner, or an owner of the workspace, signed in. Its tokens stop at once and its waiting requests are turned down. Audited as agent.revoked."
      responses:
        "204":
          description: Revoked.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/policy:
    get:
      tags: [Agents]
      operationId: getAgentPolicy
      summary: The workspace's agent policy
      description: "Every cell (action × environment class: preview, other, protected; code and issues have one cell, any) with its decision (allow, ask, never) and default, and the projects with rules of their own. Reads are always allowed and are not a cell. A database or cache counts as protected outside previews (D-101)."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPolicy'
                required: [data]
                type: object
          description: OK.
    put:
      tags: [Agents]
      operationId: putAgentPolicy
      summary: Change cells of the agent policy
      description: "Owners, signed in. A cell that loosens (never → ask → allow) needs X-Toft-Reauth (403 reauth_required). Audited as agent.policy_changed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPolicyInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPolicy'
                required: [data]
                type: object
          description: The policy now.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/policy/projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    put:
      tags: [Agents]
      operationId: putAgentProjectPolicy
      summary: Change a project's own agent rules
      description: "Owners, signed in (D-101). A cell replaces the workspace's for this project; an empty decision drops it. A change that loosens what applies to the project needs X-Toft-Reauth (403 reauth_required). Audited as agent.project_policy_changed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectPolicyInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPolicy'
                required: [data]
                type: object
          description: The policy now.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Agents]
      operationId: deleteAgentProjectPolicy
      summary: Drop a project's own agent rules
      description: "Owners, signed in. The project follows the workspace again; when that loosens a cell, needs X-Toft-Reauth."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPolicy'
                required: [data]
                type: object
          description: The policy now.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/pause:
    get:
      tags: [Agents]
      operationId: getAgentPause
      summary: Whether agents are paused, in the workspace and on the panel
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPause'
                required: [data]
                type: object
          description: OK.
    post:
      tags: [Agents]
      operationId: pauseAgents
      summary: Pause every agent in the workspace
      description: "Owners, signed in. Every agent call is refused (403 agents_paused) and waiting requests are turned down; deploys already running finish; connections stay."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPause'
                required: [data]
                type: object
          description: Paused.
        "403":
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Agents]
      operationId: resumeAgents
      summary: Resume the workspace's agents
      description: Owners, signed in, with X-Toft-Reauth.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPause'
                required: [data]
                type: object
          description: Resumed.
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/instance/agents/pause:
    post:
      tags: [Agents]
      operationId: pauseInstanceAgents
      summary: Pause every agent on the panel
      description: "Instance operators, signed in. As the workspace's pause, for every workspace; recorded in the instance audit log as agents.paused."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPause'
                required: [data]
                type: object
          description: Paused.
        "403":
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Agents]
      operationId: resumeInstanceAgents
      summary: Resume agents on the panel
      description: Instance operators, signed in, with X-Toft-Reauth.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentPause'
                required: [data]
                type: object
          description: Resumed.
        "403":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/approvals:
    get:
      tags: [Agents]
      operationId: listAgentApprovals
      summary: Agents' requests waiting for a person
      description: Oldest first; expired ones are left out.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AgentWaiting'
                    type: array
                required: [data]
                type: object
          description: OK.
  /api/v1/agents/approvals/{approvalID}:
    parameters:
      - {name: approvalID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Agents]
      operationId: getAgentApproval
      summary: One request, waiting or decided
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentApproval'
                required: [data]
                type: object
          description: OK.
        "404":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/approvals/{approvalID}/approve:
    parameters:
      - {name: approvalID, in: path, required: true, schema: {type: string}}
    post:
      tags: [Agents]
      operationId: approveAgentApproval
      summary: Approve, and run it
      description: "Owners and developers, signed in: never an agent or a key (403 session_required), so an agent never approves its own request. Runs the request once, as the agent, and returns it with its result. 409 approval_closed when it was decided or expired. Audited as agent.approved."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDecisionInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentApproval'
                required: [data]
                type: object
          description: Approved and run.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
  /api/v1/agents/approvals/{approvalID}/deny:
    parameters:
      - {name: approvalID, in: path, required: true, schema: {type: string}}
    post:
      tags: [Agents]
      operationId: denyAgentApproval
      summary: Deny, with an optional note the agent reads
      description: As approve, without running anything. Audited as agent.denied.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDecisionInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgentApproval'
                required: [data]
                type: object
          description: Denied.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: "A session token from POST /api/v1/auth/login, sent as `Authorization: Bearer`. Send `X-Toft-Org` to work in a workspace other than the account's default (D-52)."
    apiKey:
      type: http
      scheme: bearer
      description: "A workspace API key (`paas_…`) from Settings → API keys, sent as `Authorization: Bearer`, with `X-Toft-Org` set to its workspace. Project-scoped keys reach only their project's deploys, variables and code, by their scopes."
    agent:
      type: http
      scheme: bearer
      description: "An agent's OAuth access token (`toft_oat_…`, D-100), from the panel's authorization server (/.well-known/oauth-authorization-server): what the MCP endpoint takes. The API takes it too, within its connection's workspace, projects and scopes, under the workspace's agent policy."
    gitBasic:
      type: http
      scheme: basic
      description: "git over HTTPS: any username, an API key (`paas_…`) as the password. A full-access key acts as its account; a project-scoped key needs code_read (clone, fetch) or code_write (push too) and reaches only its project's repository. Session tokens and account passwords are refused."
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
    RepositoryID:
      name: repositoryID
      in: path
      required: true
      schema:
        type: string
    CommitSHA:
      name: sha
      in: path
      required: true
      description: A commit's SHA, full or at least 4 hex digits.
      schema:
        type: string
    PullNumber:
      name: pullNumber
      in: path
      required: true
      description: The pull request's number in its repository.
      schema:
        type: integer
    CommentID:
      name: commentID
      in: path
      required: true
      schema:
        type: string
    MirrorID:
      name: mirrorID
      in: path
      required: true
      schema:
        type: string
    WebhookID:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
    DeliveryID:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
    PageID:
      name: pageID
      in: path
      required: true
      schema:
        type: string
    DocVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
    IssueNumber:
      name: issueNumber
      in: path
      required: true
      description: The issue's number in its project (12 in STO-12).
      schema:
        type: integer
    ViewID:
      name: viewID
      in: path
      required: true
      schema:
        type: string
    IssueStatusQuery:
      name: status
      in: query
      description: Comma-separated statuses; every status without it.
      schema:
        type: string
    IssuePriorityQuery:
      name: priority
      in: query
      description: Comma-separated priorities.
      schema:
        type: string
    IssueAssigneeQuery:
      name: assignee
      in: query
      description: An account's id, me, or none for the unassigned.
      schema:
        type: string
    IssueLabelQuery:
      name: label
      in: query
      description: Comma-separated labels; an issue matches with any of them.
      schema:
        type: string
    IssueSearchQuery:
      name: q
      in: query
      description: Words of the title, by prefix, or the issue's number (12 or STO-12).
      schema:
        type: string
        maxLength: 200
    TypeID:
      name: typeID
      in: path
      required: true
      schema:
        type: string
    RelationID:
      name: relationID
      in: path
      required: true
      schema:
        type: string
    IssueTypeQuery:
      name: type
      in: query
      description: Comma-separated type IDs.
      schema:
        type: string
    IssueParentQuery:
      name: parent
      in: query
      description: The parent's key (VLB-12); its children only.
      schema:
        type: string
    IssueCycleQuery:
      name: cycle
      in: query
      description: "current, next, none (in no cycle) or a cycle's number (D-90); a cycle that doesn't exist matches nothing."
      schema:
        type: string
    CycleNumber:
      name: cycleNumber
      in: path
      required: true
      description: The cycle's number in its workspace (14 in Cycle 14).
      schema:
        type: integer
    RefQuery:
      name: ref
      in: query
      description: "A branch, a tag, or a commit's SHA (4 hex digits or more), tried in that order; the default branch without it."
      schema:
        type: string
    PathQuery:
      name: path
      in: query
      description: "A path in the repository, relative, with no '.', '..' or empty segment; the root without it."
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 'Page size: 50 by default, 200 at most.'
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      description: Where the previous page ended, from its `next`; the first page without it.
      schema:
        type: string
    GitWorkspace:
      name: workspace
      in: path
      required: true
      description: The workspace's slug, as in the clone URL.
      schema:
        type: string
    GitRepo:
      name: repo
      in: path
      required: true
      description: The repository's name, with or without `.git`.
      schema:
        type: string
    AuditAPIKeyQuery:
      name: api_key
      in: query
      description: "API keys: any (entries made with a key), none (entries made without one; entries from before migration 0048 have no key ID, so a person's from then count as none)."
      schema:
        type: string
        enum: [any, none]
  responses:
    ApprovalPending:
      description: "An agent's call waits for a person: the agent policy says Ask (D-100, D-102)."
      content:
        application/json:
          schema:
            properties:
              data:
                $ref: '#/components/schemas/AgentApprovalPending'
            required: [data]
            type: object
    GitRefusal:
      description: "Git's smart HTTP refuses in text/plain, the one format git shows its user (as `remote: <reason>`), and only from the ref advertisement, which git reads first: a credential, a role or an agent's limit is refused there. A refused ref (a protected branch, an agent's other branch) is git's own report in the receive-pack result. Only the rate limit (429) answers with a Problem."
      content:
        text/plain:
          schema:
            type: string
    Problem:
      description: "An error. Clients read `code` and `detail`; `error` and `data.code` stay for older clients until /api/v2."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OAuthResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
        resource_name:
          type: string
    OAuthRegistration:
      type: object
      required: [redirect_uris]
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
    OAuthClientInformation:
      type: object
      required: [client_id, client_name, redirect_uris]
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
    OAuthTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        redirect_uri:
          type: string
        client_id:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
        resource:
          type: string
    OAuthToken:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        error_description:
          type: string
    AgentClientView:
      type: object
      required: [name, kind, verified, redirect_host, scopes, requested]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [cimd, dcr]
          description: cimd, a metadata document at an https address (verified is its host); dcr, a name the client gave itself when it registered.
        verified:
          type: string
        redirect_host:
          type: string
        scopes:
          type: array
          items:
            type: string
        requested:
          type: array
          items:
            type: string
    AgentConsentInput:
      type: object
      required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method, allow]
      properties:
        response_type:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        state:
          type: string
        scope:
          type: string
        resource:
          type: string
        allow:
          type: boolean
        org_id:
          type: string
        all_projects:
          type: boolean
        project_ids:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
            enum: [read, deploy, code, issues, variables, runbooks]
    AgentConnection:
      type: object
      required: [id, name, client_kind, client, user_id, user_name, user_email, user_role, all_projects, projects, scopes, created_at, expires_at, last_used_at, last_tool]
      properties:
        id:
          type: string
        name:
          type: string
        client_kind:
          type: string
          enum: [cimd, dcr]
        client:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        user_email:
          type: string
        user_role:
          type: string
        all_projects:
          type: boolean
        projects:
          type: array
          items:
            type: string
          description: The names of the projects it reaches, unless all_projects.
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        last_tool:
          type: string
