      description: "One JSON-RPC message per POST (MCP 2026-07-28, and the older revisions clients fall back to), answered with JSON or a server-sent event stream that carries progress. Takes an agent's access token only; without a valid one, 401 with WWW-Authenticate pointing at the protected resource metadata. The tools are x-toft-tools in this document. Not enveloped: MCP's own messages. 120 calls a minute per token."
      security:
