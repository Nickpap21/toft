      properties:
        id:
          type: string
        agent:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        action:
          type: string
        tool:
          type: string
        service_id:
          type: string
          nullable: true
        target:
          type: string
        reason:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AgentApproval:
      type: object
      required: [id, connection_id, agent, user_id, user_name, user_role, action, tool, service_id, environment_id, project_id, target, env_class, request, reason, plan, plan_steps, rollback, state, expires_at, decided_by, decided_at, note, executed_at, result, created_at]
      properties:
        id:
          type: string
        connection_id:
          type: string
        agent:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        user_role:
          type: string
        action:
          type: string
        tool:
          type: string
        service_id:
          type: string
          nullable: true
        environment_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        target:
          type: string
        env_class:
          type: string
          enum: [preview, other, protected, any, ""]
          description: "The class the agent policy reads for the target now; a database or cache counts as protected (D-101). Empty when the target is gone."
        request:
          type: object
          required: [method, path]
          description: "What Approve runs. set_secret's value is never in it: it waits encrypted apart, and is deleted once the request is over (D-102)."

          properties:
            method:
              type: string
            path:
              type: string
            body:
              type: object
              additionalProperties: {}
        reason:
          type: string
        plan:
          type: string
        plan_steps:
          type: array
          description: "The plan as the agent gave it in steps (plan_steps), each with Toft's mark (D-146). Empty when it gave its plan as text only."
          items:
            $ref: '#/components/schemas/AgentPlanStep'
        rollback:
          $ref: '#/components/schemas/AgentRollbackAllowance'
        state:
          type: string
          enum: [waiting, approved, denied, cancelled, expired]
        expires_at:
          type: string
          format: date-time
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
        executed_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          required: [status]
          properties:
            status:
              type: integer
            body:
              type: object
              additionalProperties: {}
        created_at:
          type: string
          format: date-time
    AgentPlanStep:
      type: object
      required: [text, tool, service_id, mark]
      properties:
        text:
          type: string
        tool:
          type: string
          description: "The tool the step names; empty when it names none."
        service_id:
          type: string
          nullable: true
        mark:
          type: string
          nullable: true
          enum: [this_request, allowed_by_this_approval, will_ask_again, refused, null]
          description: "What the step needs, by the policy now: this very request; covered by approving it (the rollback, D-146); a person again; refused (Never). Null for a step that names no tool, or one the policy allows."
    AgentRollbackAllowance:
      type: object
      nullable: true
      required: [to_deployment_id, to_commit, commit, live_at, until, used_at, active]
      description: "A deploy's approval also allows the same agent to roll the service back to what was live before it, once, for 30 minutes after the approved deploy goes live, while it is still what's live and the person who approved is still an owner or developer (D-146). Null for any other tool, a first deploy, or a request denied, cancelled or expired. While the request waits, it names what is live now."
      properties:
        to_deployment_id:
          type: string
        to_commit:
          type: string
          description: "The commit of the deployment it rolls back to; empty for an image deploy."
        commit:
          type: string
          description: "The approved deployment's commit; empty for an image deploy or until it runs. live_at says whether it went live."
        live_at:
          type: string
          format: date-time
          nullable: true
          description: "When the approved deploy went live; null until it does."
        until:
          type: string
          format: date-time
          nullable: true
          description: "30 minutes after the approved deploy went live; null until it does."
        used_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
          description: "Whether a rollback to to_deployment_id would be covered now."
    AgentDecisionInput:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
        commit:
          type: string
          pattern: '^[0-9a-fA-F]{40}$'
          description: "Approve only: the full SHA of the commit the person was shown. A deploy that names no commit runs this one, not its branch's head when it builds; a deploy that names a commit keeps it, and anything else ignores this. 400 invalid_input when it isn't a full SHA."
