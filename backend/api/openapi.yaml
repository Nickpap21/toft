  /api/v1/instance/panel/pty:
    get:
      tags: [Instance]
      operationId: getInstancePanelPty
      summary: A root shell on the panel's own server; operators only, password proof
      description: 'D-68. The backend starts a short-lived helper container that enters the host''s namespaces, so no SSH is involved. Opening and closing are written to the instance audit log. 403 with code panel_shell_off while TOFT_PANEL_HOST_SHELL=off, reauth_required without the password proof, session_required with an API key.'
      responses:
        "101":
          description: 'Switching protocols: WebSocket. Binary frames are terminal bytes from the host; text frames are JSON messages ({type: input, data}, {type: resize, cols, rows}; from the server {type: error, data}). ?token= carries the session and ?reauth= the proof, since the handshake has no headers (D-53).'
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - description: Initial width.
          in: query
          name: cols
          schema:
            type: integer
        - description: Initial height.
          in: query
          name: rows
          schema:
            type: integer
        - description: The session token.
          in: query
          name: token
          schema:
            type: string
        - description: The X-Toft-Reauth proof.
          in: query
          name: reauth
          schema:
            type: string
  /api/v1/instance/panel/server:
    get:
      tags: [Instance]
