      required: [id, scope, project_id, name, type, source_type, build_pack, port, replicas, runtime_status, compose_route_service, deploy_strategy, effective_deploy_strategy, isolation_advice, kind, pids_limit, deploy_timeout_minutes, has_registry_password, has_git_token, health_check_path, health_check_timeout, health_check_retries, required_env_vars, migrate_command, created_at, updated_at, last_deploy_failed, rollback_images_kept]
