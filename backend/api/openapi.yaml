          type: integer
          description: The most processes each container may run (D-93); 0 is the platform's default, 2048.
        deploy_timeout_minutes:
          type: integer
          description: How long a deploy may run before it fails as timed out, in minutes (D-125); 0 is the platform's default, 60. Waiting for a build slot doesn't count.
        rollback_images_kept:
