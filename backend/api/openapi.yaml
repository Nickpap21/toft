    Invite:
      type: object
      required: [id, org_id, created_by, token, role, expires_at, created_at]
      properties:
        id:
          type: string
        org_id:
          type: string
        created_by:
          type: string
        token:
          type: string
        role:
          type: string
          enum: [owner, developer, viewer]
        expires_at:
          format: date-time
          type: string
        used_at:
          format: date-time
          type: string
          nullable: true
        created_at:
          format: date-time
          type: string
    InviteInput:
      type: object
      properties:
        role:
          type: string
          enum: [owner, developer, viewer]
          description: Defaults to developer.
    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 512
    InviteValidation:
      type: object
      required: [invite_id, org_id, org_name, role, expires_at, invited_by]
      properties:
        invite_id:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        role:
          type: string
        expires_at:
          format: date-time
          type: string
        invited_by:
          type: string
    AuditTarget:
      type: object
      required: [kind, id, name, deleted]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
