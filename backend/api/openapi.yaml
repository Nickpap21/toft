  /api/v1/services/{serviceID}/admin-password:
    parameters:
      - name: serviceID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Variables and secrets]
      operationId: getServicesServiceidAdminPassword
      summary: Whether the caller has a copy of the service's admin password waiting
      description: 'D-160: a catalog app''s admin password (or temporary login) is kept, sealed, for the person who created the service, until they dismiss it or 7 days pass, then deleted. This says whether the caller has one, without its value. Owners and developers, a signed-in session only (session_required for an API key or an agent).'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPasswordPending'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Variables and secrets]
      operationId: postServicesServiceidAdminPassword
      summary: Reset the service's app admin password
      description: 'D-160: gives a catalog app''s admin login (Grafana, Umami, pgAdmin, RabbitMQ, MinIO) a new generated password. In one transaction, the secret is replaced, a copy kept for the caller as after a create (every older copy is deleted), and the app''s own command sets it in its running container, the password on stdin only (reset app); a second reset of the service waits for the first. MinIO reads it at each start: deploy is true and the next deploy applies it (reset deploy). Owners and developers, a signed-in session and the password confirmed (X-Toft-Reauth; reauth_required without it, session_required for an API key or an agent). Audited without the value. 409 no_reset (no Reset for this app: a database root, or not a catalog app), 409 not_running (the app''s container isn''t running), 502 reset_failed (the app refused it: nothing changed; data.output is what the app printed, without the password), 502 reset_unconfirmed (the command ran but its answer never came within 2 minutes: the new password is stored and kept for the caller, as the app most likely has it; a reset again settles it). Returns the new password once (Cache-Control: no-store); the screen confirms first in a protected environment.'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AdminPasswordValue'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Variables and secrets]
      operationId: deleteServicesServiceidAdminPassword
      summary: Dismiss the caller's copy of the admin password
      description: 'Deletes the caller''s copy (D-160), audited without the value. Owners and developers, a signed-in session only. 404 no_admin_password when there is none.'
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/services/{serviceID}/admin-password/value:
    parameters:
