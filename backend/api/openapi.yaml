      required: [id, service_id, path, content, created_at, updated_at]
      properties:
        id:
          type: string
        service_id:
          type: string
        path:
          type: string
        content:
          type: string
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
    MountedBy:
      type: object
      required: [service_id, service_name, target, read_only]
      properties:
        service_id:
          type: string
        service_name:
          type: string
        target:
          type: string
        read_only:
          type: boolean
    Volume:
      type: object
      required: [id, server_id, server_name, name, size_limit_bytes, used_bytes, used_at, created_at, mounts]
      properties:
        id:
          type: string
        server_id:
          type: string
        server_name:
          type: string
        name:
          type: string
        size_limit_bytes:
          type: integer
        used_bytes:
          type: integer
          nullable: true
        used_at:
          format: date-time
          type: string
          nullable: true
        created_at:
          format: date-time
          type: string
        mounts:
          items:
            $ref: '#/components/schemas/MountedBy'
          type: array
    SharedvolumeCreateInput:
      type: object
      properties:
        name:
          type: string
        server_id:
          type: string
        size_limit_bytes:
          type: integer
    SizeLimitInput:
      type: object
      properties:
        size_limit_bytes:
          type: integer
          description: 0 removes the limit.
    Mount:
      type: object
      required: [shared_volume_id, target, read_only]
      properties:
        shared_volume_id:
          type: string
        name:
          type: string
        target:
          type: string
        read_only:
          type: boolean
    MountsInput:
      type: object
      required: [mounts, version]
      properties:
        mounts:
          items:
            $ref: '#/components/schemas/Mount'
          type: array
          description: The whole list. An empty one clears it; leaving it out is refused.
        version:
          type: string
          description: The `version` of the list this replaces, from its GET or the last PUT.
    Suggestion:
      type: object
      required: [direction, value, reason, days]
      properties:
        direction:
          type: string
        value:
          type: string
        reason:
          type: string
        days:
          type: integer
    MemoryUsage:
      type: object
      required: [limit, source, file_limit, peak_14d_mb, days, oom_kills_7d, suggestion]
      properties:
        limit:
          type: string
        source:
          type: string
        file_limit:
          type: string
        peak_14d_mb:
          type: number
          nullable: true
        days:
          type: integer
        oom_kills_7d:
          type: integer
        suggestion:
          allOf:
            - $ref: '#/components/schemas/Suggestion'
          nullable: true
    CPUUsage:
      type: object
      required: [limit, p95_cores, throttled_max_pct, wait_avg_pct, suggestion]
      properties:
        limit:
          type: string
        p95_cores:
          type: number
          nullable: true
        throttled_max_pct:
          type: number
          nullable: true
        wait_avg_pct:
          type: number
          nullable: true
        suggestion:
          allOf:
            - $ref: '#/components/schemas/Suggestion'
          nullable: true
    ResourceRow:
      type: object
      required: [compose_service, kind, memory, cpu, restarts_24h, restarts_since]
      properties:
        compose_service:
          type: string
        kind:
          type: string
        memory:
          $ref: '#/components/schemas/MemoryUsage'
        cpu:
          $ref: '#/components/schemas/CPUUsage'
        restarts_24h:
          type: integer
          nullable: true
          description: >-
            Times Docker restarted this compose service's containers (a single
            container's) in the last 24 hours. A redeploy's or a slot swap's new
            containers add nothing. Null when no sample of the 24 hours carries a
            restart count (a server whose agent predates it).
        restarts_since:
          format: date-time
          type: string
          nullable: true
          description: >-
            When the samples restarts_24h counts start, while they cover less than
            the 24 hours (the first day after the upgrade, or a newer service);
            null when they cover all of it, or restarts_24h is null.
    ServiceResources:
      type: object
      required: [grace_until, rows, latency_24h]
      properties:
        grace_until:
          format: date-time
          type: string
          nullable: true
        rows:
          items:
            $ref: '#/components/schemas/ResourceRow'
          type: array
        latency_24h:
          allOf:
            - $ref: '#/components/schemas/ServiceLatency'
          nullable: true
          description: >-
            The service's HTTP request latency over the last 24 hours, as its
            server's Traefik measured it (D-156). Null when no minute of it was
            recorded: the service has no domain, or it was routed in the last
            two minutes.
    ServiceLatency:
      type: object
      required: [requests, p95_ms, p95_bucket, since, unmeasured]
      properties:
        requests:
          type: integer
          format: int64
          description: >-
            HTTP requests the service answered in the measured minutes. Not
            counted: answers a middleware gave first (basic auth's 401, an IP
            allowlist's 403, a redirect), and SSE and WebSocket streams, whose
            duration is the stream's.
        p95_ms:
          type: number
          nullable: true
          description: >-
            The 95th percentile of their durations in milliseconds, interpolated
            linearly within its bucket (p95_bucket); above the top bucket, the
            top bound. Null under 20 requests.
        p95_bucket:
          allOf:
            - $ref: '#/components/schemas/LatencyBucket'
          nullable: true
          description: The bucket p95_ms falls in; null with p95_ms.
        since:
          format: date-time
          type: string
          nullable: true
          description: >-
            The first measured minute, while the measured minutes cover less than
            the 24 hours; null once they cover it, or none was measured.
        unmeasured:
          type: string
          enum: [agent, adopted, traefik, null]
          nullable: true
          description: >-
            Why the newest minute was not measured; null when it was. agent: the
            server's agent predates latency (it upgrades when it connects).
            adopted: Toft didn't start this server's Traefik, and leaves it as it
            is. traefik: the Traefik Toft started doesn't keep the latency buckets
            yet, or didn't answer. On a remote server it restarts with them on
            its own, or at the next Re-provision after a failed one; on the
            panel's host, `toft upgrade` recreates it with them.
    LatencyBucket:
      type: object
      required: [low_ms, high_ms]
      properties:
        low_ms:
          type: number
        high_ms:
          type: number
          nullable: true
          description: Null for the bucket above the top bound.
    ComposeLimit:
      type: object
      properties:
        memory_mb:
          type: integer
        cpu_cores:
          type: number
          nullable: true
    ComposeLimitsInput:
      type: object
      required: [limits, version]
      properties:
        limits:
          additionalProperties:
            $ref: '#/components/schemas/ComposeLimit'
          type: object
          description: By compose service name. An empty object clears them; leaving it out is refused.
        version:
          type: string
          description: The `version` of the limits this replaces, from GET resources or the last PUT.
    ServerSuggestion:
      type: object
      required: [service_id, service_name, compose_service, suggestion]
      properties:
        service_id:
          type: string
        service_name:
          type: string
        compose_service:
          type: string
        suggestion:
          $ref: '#/components/schemas/Suggestion'
    CPUWaitDay:
      type: object
      required: [day, avg_pct]
      properties:
        day:
          type: string
        avg_pct:
          type: number
    ServerResources:
      type: object
      required: [services, frees_mb, cpu_wait]
      properties:
        services:
          items:
            $ref: '#/components/schemas/ServerSuggestion'
          type: array
        frees_mb:
          type: integer
        cpu_wait:
          allOf:
            - $ref: '#/components/schemas/CPUWaitDay'
          nullable: true
    DefaultLimit:
      type: object
      required: [kind, memory_mb]
      properties:
        kind:
          type: string
        memory_mb:
          type: integer
    CreateServerInput:
      type: object
      required: [name, ip_address, user, port, ssh_key]
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        ip_address:
          type: string
        user:
          type: string
          maxLength: 64
        port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_key:
          type: string
          maxLength: 16384
    CreateAgentServerInput:
      type: object
      required: [connection]
      properties:
        connection:
          type: string
          enum: [agent]
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Without one, the caller's waiting server is reused or one named server-<n> is made (D-153).
        ip_address:
          type: string
          description: The address apps are reached on; the agent's connection fills it in when empty.
    RenameServerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Lowercase letters, digits and dashes, starting and ending with a letter or digit (D-153).
    ServerSSHKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The key's authorized_keys line, "ssh-ed25519 AAAA… toft-<server name>".
    UseSSHInput:
      type: object
      required: [ip_address, port]
      properties:
        ip_address:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_key:
          type: string
          maxLength: 16384
          description: An existing private key instead of the one Toft made.
    MoveConnectionInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ssh, agent]
        user:
          type: string
          maxLength: 64
        port:
          type: integer
          minimum: 1
          maximum: 65535
        ssh_key:
          type: string
          maxLength: 16384
          description: Empty keeps the stored key.
    AgentJoin:
      type: object
      required: [token, command, expires_at, panel_key_fingerprint]
      properties:
        token:
          type: string
        command:
          type: string
        expires_at:
          format: date-time
          type: string
        panel_key_fingerprint:
          type: string
    ServerAgent:
      type: object
      required: [status, since, last_seen_at, version, arch, key_fingerprint, key_pinned_at, from_ip, rtt_ms, token_expires_at, panel_key_fingerprint, desired, routes, frozen, rejoin]
      properties:
        status:
          type: string
          enum: [connected, reconnecting, upgrading, offline, waiting, revoked]
        since:
          format: date-time
          type: string
          nullable: true
        last_seen_at:
          format: date-time
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        arch:
          type: string
          nullable: true
        key_fingerprint:
          type: string
          nullable: true
        key_pinned_at:
          format: date-time
          type: string
          nullable: true
        from_ip:
          type: string
          nullable: true
        rtt_ms:
          type: integer
          nullable: true
        token_expires_at:
          format: date-time
          type: string
          nullable: true
        panel_key_fingerprint:
          type: string
          nullable: true
        desired:
          description: The desired state the agent holds (D-111). Null until the agent first answers it.
          allOf:
            - $ref: '#/components/schemas/ServerAgentDesired'
          nullable: true
        routes:
          description: How many services the agent's route files route (D-113). Null while the server's Traefik reads the containers' labels.
          type: integer
          nullable: true
        frozen:
          description: Set while the agent holds another panel epoch's state (the panel was restored from an older backup, D-113). Deploys, moves and removals there answer 409 server_frozen until adopt or use-panel-state.
          allOf:
            - $ref: '#/components/schemas/ServerAgentFrozen'
          nullable: true
        rejoin:
          description: A join token for this server would replace a machine Toft trusted (a pinned or revoked agent), so issuing one needs the password.
          type: boolean
    ServerAgentFrozen:
      type: object
      required: [since, changes]
      properties:
        since:
          format: date-time
          type: string
        changes:
          description: Newer first, then missing, unknown and same.
          type: array
          items:
            $ref: '#/components/schemas/ServerAgentFrozenChange'
    ServerAgentFrozenChange:
      type: object
      required: [service_id, container, kind, deployment_id, image, started_at]
      properties:
        service_id:
          description: Null for a container of a service the panel doesn't have here.
          type: string
          nullable: true
        container:
          type: string
          nullable: true
        kind:
          description: newer runs another deployment than the panel's active one (adopting makes it the active one); same runs the panel's; unknown is a container of a service the panel doesn't have; missing doesn't run although the panel says it should.
          type: string
          enum: [newer, same, unknown, missing]
        deployment_id:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        started_at:
          format: date-time
          type: string
          nullable: true
    ServerAgentDesired:
      type: object
      required: [spec_generation, observed_generation, drift, checked_at]
      properties:
        spec_generation:
          description: Raised whenever what should run on the server changes.
          type: integer
          format: int64
        observed_generation:
          description: The generation the agent holds; behind while lower than spec_generation.
          type: integer
          format: int64
        drift:
          type: array
          items:
            $ref: '#/components/schemas/ServerAgentDrift'
        checked_at:
          description: When the agent last reported its drift.
          format: date-time
          type: string
    ServerAgentDrift:
      type: object
      required: [service_id, kind, container]
      properties:
        service_id:
          description: Null for a compose container of a service the panel doesn't have.
          type: string
          nullable: true
        kind:
          type: string
          enum: [missing, stopped, crash_loop, orphan]
        container:
          description: The container's name, for an orphan.
          type: string
          nullable: true
    ServerResponse:
      type: object
      required: [id, org_id, user_id, name, ip_address, user, port, status, provisioned_at, total_cpu_cores, total_memory_mb, host_key_type, host_key_fingerprint, host_key_pinned_at, created_at, updated_at, connection, agent, ssh_key_stored]
      properties:
        id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        name:
          type: string
        ip_address:
          type: string
        user:
          type: string
        port:
          type: integer
        status:
          type: string
        provisioned_at:
          format: date-time
          type: string
          nullable: true
        total_cpu_cores:
          type: number
        total_memory_mb:
          type: integer
        cpu_cores_override:
          type: number
          nullable: true
        memory_mb_override:
          type: integer
          nullable: true
        host_key_type:
          type: string
          nullable: true
        host_key_fingerprint:
          type: string
          nullable: true
        host_key_pinned_at:
          format: date-time
          type: string
          nullable: true
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        app_networks:
          type: string
        address_pool:
          type: string
          deprecated: true
          description: Deprecated since v0.36.0; GET /api/v1/servers/{serverID}/capabilities' address_pools replaces it and it goes in a later release. GET /servers/{serverID} only, the first of address_pools' bases (10.203.0.0/16); absent when there is none.
        connection:
          type: string
          enum: [ssh, agent]
        agent:
          allOf:
            - $ref: '#/components/schemas/ServerAgent'
          nullable: true
        ssh_key_stored:
          type: boolean
        provision_warnings:
          type: array
          items:
            type: string
          description: "GET /servers only: what the last provisioning run, which ended ok, left out (as ProvisionRun.warnings); absent when nothing."
        join:
          $ref: '#/components/schemas/AgentJoin'
    SharedServerResponse:
      type: object
      description: A server another workspace shares with this one; its totals are the share's.
      required: [id, name, status, provisioned_at, shared, shared_by, shared_by_org_id, total_cpu_cores, total_memory_mb]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        provisioned_at:
          format: date-time
          nullable: true
          type: string
        shared:
          type: boolean
          description: Always true; marks it apart from the workspace's own.
        shared_by:
          type: string
          description: The owning workspace's name.
        shared_by_org_id:
          type: string
        total_cpu_cores:
          type: number
        total_memory_mb:
          type: integer
          format: int64
    ConnectionResult:
      type: object
      required: [host, latency_ms, host_key_type, host_key_fingerprint, host_key_newly_pinned]
      properties:
        host:
          type: string
        latency_ms:
          type: integer
        host_key_type:
          type: string
        host_key_fingerprint:
          type: string
        host_key_newly_pinned:
          type: boolean
    ServerExecInput:
      type: object
      required: [command]
      properties:
        command:
          type: string
          maxLength: 4000
    SystemStats:
      type: object
      required: [cpu_percent, mem_used_mb, mem_total_mb, disk_used_mb, disk_total_mb, load_1, load_5, load_15, uptime]
      properties:
        cpu_percent:
          type: number
        mem_used_mb:
          type: integer
        mem_total_mb:
          type: integer
        disk_used_mb:
          type: integer
        disk_total_mb:
          type: integer
        load_1:
          type: string
        load_5:
          type: string
        load_15:
          type: string
        uptime:
          type: string
        docker_version:
          type: string
        uptime_seconds:
          type: integer
        traefik_status:
          type: string
        traefik_image:
          type: string
    WorkspaceAllocation:
      type: object
      required: [org_id, org_name, projects, services, cpu_cores, memory_mb]
      properties:
        org_id:
          type: string
        org_name:
          type: string
        projects:
          items:
            type: string
          type: array
        services:
          type: integer
        cpu_cores:
          type: number
        memory_mb:
          type: number
    HostUpdates:
      type: object
      description: What the last updates read found on a server or the panel's own (D-133). Read from apt's package lists and stamps, Docker and /var/run/reboot-required; nothing is installed.
      required: [checked_at, read_at, error, lists_updated_at, security, other, held, packages, removals, truncated, reboot, docker, unattended]
      properties:
        checked_at:
          type: string
          format: date-time
          description: When the last read ran, whether or not it worked.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: When the last read that worked ran, which everything below comes from; null before one.
        error:
          type: string
          description: Why the last read couldn't run; empty when it did. The rest is what the last read that worked found.
        lists_updated_at:
          type: string
          format: date-time
          nullable: true
          description: When apt's daily job last downloaded the package lists; null when it never has. Updates published since are not counted.
        security:
          type: integer
          description: Pending updates from a security origin.
        other:
          type: integer
          description: Every other pending update, Docker's among them.
        held:
          type: integer
          description: How many pending updates, security or other, are Docker's packages, which installing updates holds back and updating Docker installs (D-134).
        packages:
          type: array
          description: The pending updates, security first, then by name; at most 500.
          items:
            type: object
            required: [name, current, candidate, security]
            properties:
              name:
                type: string
              current:
                type: string
                description: The installed version; empty for a package the upgrade would add.
              candidate:
                type: string
              security:
                type: boolean
        removals:
          type: array
          description: The packages apt would remove to install the pending updates; usually none. At most 500.
          items:
            type: string
        truncated:
          type: boolean
          description: More updates are pending than packages lists.
        reboot:
          type: object
          required: [required, since, packages]
          properties:
            required:
              type: boolean
            since:
              type: string
              format: date-time
              nullable: true
            packages:
              type: array
              items:
                type: string
              description: The packages that asked for the reboot.
        docker:
          type: object
          required: [version, package, candidate, advisories]
          properties:
            version:
              type: string
              description: The engine running now; empty when Docker didn't answer.
            package:
              type: string
              description: The package that installed it, docker-ce (Docker's) or docker.io (the distribution's, which backports fixes, so Docker's advisories aren't matched against it); empty for neither.
            candidate:
              type: string
              description: The newer engine apt would install; empty when none is pending.
            advisories:
              type: array
              description: Docker's published security advisories that affect the running engine; none for docker.io.
              items:
                type: object
                required: [id, severity, summary, fixed_in, url]
                properties:
                  id:
                    type: string
                    description: The GitHub advisory ID (GHSA-…).
                  severity:
                    type: string
                    enum: [low, medium, high, critical]
                  summary:
                    type: string
                  fixed_in:
                    type: string
                    description: The first engine release that fixes it.
                  url:
                    type: string
        unattended:
          type: object
          required: [state, last_run_at, last_success_at, last_result, last_error]
          properties:
            state:
              type: string
              enum: [active, inactive, missing, unknown]
              description: The unattended-upgrades unit's state; unknown until a read works, when the rest of the report is empty too.
            last_run_at:
              type: string
              format: date-time
              nullable: true
              description: When unattended-upgrades last ran; null when it never has.
            last_success_at:
              type: string
              format: date-time
              nullable: true
            last_result:
              type: string
              enum: [ok, failed, never, unknown]
            last_error:
              type: string
              description: The last run's last error line, when it failed.
    ServerCapabilities:
      type: object
      required: [kernel, arch, cgroup_v2, virtualization, kvm, docker_version, apparmor, seccomp, runtimes, error, probed_at, levels]
      properties:
        kernel:
          type: string
        arch:
          type: string
        cgroup_v2:
          type: boolean
        virtualization:
          type: string
          description: systemd-detect-virt's answer (none on bare metal).
        kvm:
          type: boolean
          description: Whether /dev/kvm is there.
        docker_version:
          type: string
        apparmor:
          type: boolean
        seccomp:
          type: boolean
        preview_firewall:
          type: boolean
          description: The host firewall's chain for untrusted previews' networks is loaded (D-97).
        dns_relay:
          type: boolean
          description: A container on Docker's bridge got an answer from Toft's agent's DNS relay, which Sandboxed with a strict network needs (D-115).
        address_pools:
          type: array
          nullable: true
          description: Docker's default-address-pools on the server, which app networks take their subnets from; empty when it has none (Docker's own ranges), null until a probe read them.
          items:
            type: object
            required: [base, size]
            properties:
              base:
                type: string
                description: An IPv4 CIDR (10.203.0.0/16).
              size:
                type: integer
                description: Each network's prefix length (24).
        runtimes:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name:
                type: string
              ok:
                type: boolean
                description: The smoke test passed.
              error:
                type: string
              version:
                type: string
                description: runsc's release (20261012.0); empty for other runtimes.
              args:
                type: array
                items:
                  type: string
                description: The runtime's arguments in Docker's configuration (D-95).
        error:
          type: string
