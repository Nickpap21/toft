      operationId: installServerGvisor
      summary: Install gVisor's runsc on the server and register it with Docker (D-95)
      description: "Instance operators, with X-Toft-Reauth (403 reauth_required; session_required for an API key), on a server of the active workspace. Server-sent events with each step's output, then event done or event error; the install carries on when the client leaves, and is recorded (GET …/gvisor). It adds gVisor's signed apt repository at the release Toft pins, installs runsc, registers it with Docker as runsc and runsc-strict by a reload (no container restarts), checks that a sandboxed container starts and finds another by name, on an agent server lets containers reach the agent's DNS relay and checks a strict container finds another by name and the health probe reaches it (D-115), and probes the server again. Running it again changes only what is missing. 409 install_running while one runs; 400 gvisor_unsupported when the server's last probe says gVisor can't run there. Audited as server.gvisor_installed or server.gvisor_install_failed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: A stream; see the description.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
