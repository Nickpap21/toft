      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
    NameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
    ConfirmInput:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
