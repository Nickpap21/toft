    put:
      tags: [Instance]
      operationId: putInstanceSetupRole
      summary: Set how the panel's server is used
      description: Operators only, sessions only. control_plane is refused while services run on the panel host (409 panel_host_in_use); apps on a server below reservation.min_cpu and min_memory_bytes (409 panel_host_too_small, D-66, D-132). Recorded in the instance audit log (D-26, D-62).
      responses:
        "200":
