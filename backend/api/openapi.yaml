    post:
      tags: [Code]
      operationId: postUserSshKeys
      summary: Add an SSH key to the account
      description: "Needs X-Toft-Reauth (403 reauth_required without it; session_required for an API key): a key outlives the session that adds it. Codes: invalid_ssh_key and weak_ssh_key (400; DSA and RSA under 2048 bits are weak, certificates are refused), ssh_key_in_use (409, on any account of the instance), too_many_ssh_keys (409, 50 an account), git_off (404). Recorded in the workspace's audit log as ssh_key.added."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSHKeyInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/SSHKey'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
