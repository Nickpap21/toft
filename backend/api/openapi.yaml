    ServiceCreateInput:
      type: object
      required: [name, type, source_type]
      properties:
        address:
          type: boolean
          description: Give the service an address now (D-150), as GET /environments/{environmentID}/address names it. Defaults to false.
        deploy:
          type: boolean
          description: "Toft starts its first deploy as soon as it is created (Create and deploy), behind every gate of POST /services/{serviceID}/deployments, and the response carries it as deployment. The deploy's capacity gate runs first, with the limits it is created with; when it won't fit its server the create is refused with 409 capacity_exceeded and nothing is created. A deploy another gate refuses leaves the service created, with the reason in deploy_error. Until 0.46.0 one create is left to its caller to deploy, as before: a catalog service (addon_slug) created from a browser session with no variables in the body, which is what a panel tab loaded before 0.45.0 sends before it saves the settings and deploys; send variables (an empty list will do) or use an API key. Defaults to false, and nothing is deployed."
        variables:
          type: array
          description: "Plain variables, stored with the service or not at all. One sent with an empty value is stored empty. A catalog service (addon_slug) gets every plain variable of its template's env_var_specs left out here at its default, with or without deploy."
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 255
              value:
                type: string
                maxLength: 32768
        secrets:
          type: array
          description: "Write-once, as POST /services/{serviceID}/secrets, stored with the service or not at all. A catalog service (addon_slug) gets every secret of its template's env_var_specs left out here generated, returned once as generated_secrets."
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 255
              value:
                type: string
                minLength: 1
                maxLength: 32768
        force:
          type: boolean
          description: With deploy, creates it past the capacity gate for a caller the gate allows to bypass (can_bypass), as POST /services/{serviceID}/deployments?force=true; its first deploy is started past the gate too. Defaults to false.
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [web, worker]
        source_type:
          type: string
          enum: [git, docker-image, docker-compose]
        scope:
          type: string
        server_id:
          type: string
        git_repo_url:
          type: string
        repository_id:
          type: string
          description: "One of the project's repositories (D-77): a git service builds from it and a compose service takes its files from it; git_repo_url and compose_repo_url stay empty, and a stored git token is dropped. On a settings save, left out keeps the source and empty switches back to the URLs. A workspace service builds from a URL only."
        deploy_on_push:
          type: boolean
          description: A push to git_branch deploys the service; true when left out on create, kept when left out on a save.
        git_branch:
          type: string
        base_directory:
          type: string
          maxLength: 255
          pattern: '^/?(?:(?:\.|[^/.][^/]*|\.[^/.][^/]*|\.\.[^/]+)?/)*(?:\.|[^/.][^/]*|\.[^/.][^/]*|\.\.[^/]+)?$'
          description: A path inside the repository ("/" or empty is its root). No ".." segment.
        docker_image:
          type: string
        install_command:
          type: string
        build_command:
          type: string
        start_command:
          type: string
        build_pack:
          type: string
        port:
          type: integer
        cpu_limit:
          type: string
        memory_limit:
          type: string
        compose_content:
          type: string
        compose_repo_url:
          type: string
        compose_file_path:
          type: string
        compose_route_service:
          type: string
        registry_server:
          type: string
        registry_username:
          type: string
        registry_password:
          type: string
        addon_slug:
          type: string
        network_alias:
          type: string
        volumes:
          items:
            $ref: '#/components/schemas/VolumeMount'
          type: array
        git_username:
          type: string
        git_token:
          type: string
        pre_deploy_commands:
          type: string
        post_deploy_commands:
          type: string
        health_check_path:
          type: string
        health_check_timeout:
          type: integer
        health_check_retries:
          type: integer
        required_env_vars:
          type: string
        migrate_command:
          type: string
        dependencies:
          items:
            type: string
          type: array
        basic_auth_user:
          type: string
        basic_auth_password:
          type: string
        ip_allowlist:
          items:
            type: string
          type: array
        container_health:
          type: string
          enum: [image, off, command]
          x-enum-varnames: [ServiceCreateInputContainerHealthImage, ServiceCreateInputContainerHealthOff, ServiceCreateInputContainerHealthCommand]
          description: "Absent is image. The Docker health check its containers are created with: image keeps the image's HEALTHCHECK, off turns it off, command runs container_health_command in the container's shell at the image's interval, timeout and retries. Compose services keep image (400 otherwise)."
        container_health_command:
          type: string
          maxLength: 1024
          description: One line, at most 1024 characters; required (non-blank) with container_health command.
    HealthAnswer:
