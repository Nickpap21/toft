          $ref: '#/components/responses/Problem'
    post:
      tags: [Servers]
      operationId: probeServerCapabilities
      summary: Check again what the server can run, over SSH; owners and developers
      description: A probe that can't run keeps what the last one read, with its error.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ServerCapabilities'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/updates:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Servers]
      operationId: getServerUpdates
      summary: The server's pending updates, reboot and Docker, as last read (D-133)
      description: Read every 6 hours over SSH or the server's agent; nothing is installed. data is null before the first read.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/HostUpdates'
                    nullable: true
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Servers]
      operationId: checkServerUpdates
      summary: Read the server's updates again now; owners and developers
      description: Reads only, from the package lists apt last downloaded; it neither refreshes them nor installs anything. A read that can't run keeps what the last one read, with its error.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/HostUpdates'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/updates/run:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Servers]
      operationId: getServerUpdateRun
      summary: The run of updates in progress, or the last one (D-134)
      description: Anyone in the workspace who can see the server. While a run lasts this reads its state from the host, so poll it; afterwards it is the stored outcome. data is null before the first run.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/UpdateRun'
                    nullable: true
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Servers]
      operationId: startServerUpdateRun
      summary: Install updates, update Docker or reboot (D-134)
      description: "Owners of the server's workspace (D-128), sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Starts the action on the host as the transient systemd unit toft-host-update and answers at once; the run goes on when the panel, the SSH connection or the agent restarts, and GET …/updates/run follows it. install refreshes apt's lists and installs every pending update with Docker's packages held for that run only, keeping changed config files; docker installs the newer Docker packages, restarting every container on the host; reboot restarts the host. When it ends the updates are read again. 409 update_running while a run lasts; 409 deploy_running for docker or reboot while a deploy runs on the host; 409 nothing_pending when the last read found nothing for install or docker to install; 409 docker_not_packaged when Docker wasn't installed from a package; 409 agent_outdated on an agent server whose agent can't run them yet (upgrade it first); 502 server_unreachable when the server can't be reached. Audited as server.updates_started, then server.updates_succeeded or server.updates_failed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunInput'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UpdateRun'
                required:
                  - data
                type: object
          description: Started.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/disk:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Servers]
      operationId: getServerDisk
      summary: What fills the disk, and what is safe to delete (D-135)
      description: "Anyone in the workspace that owns the server. Reads Docker's disk use on the server through the Docker API (at most every 5 minutes; ?fresh=true reads again) and classes every image: kept (in use by a container; the images of each service's last N live deployments, N being its rollback_images_kept; on the panel's server its running release and the one before) or removable (untagged; old builds; old panel releases; pulled images no kept deployment names). Volumes no service owns are listed one by one. 502 server_unreachable when Docker can't be reached."
      parameters:
        - name: fresh
          in: query
          required: false
          description: Read again now instead of within the last 5 minutes.
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskReport'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/disk/clean:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Servers]
      operationId: getServerDiskClean
      summary: The clean in progress, or the last one (D-135)
      description: Anyone in the workspace that owns the server. data is null before the first clean.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DiskClean'
                    nullable: true
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Servers]
      operationId: startServerDiskClean
      summary: Delete the removable classes ticked (D-135)
      description: "Owners of the server's workspace (D-128), sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Reads the disk again, then removes the images of the kinds sent, by ID and never forced (Docker keeps an image a container started from in the meantime), and with build_cache_all the whole build cache; answers at once and GET …/disk/clean follows it. Deployments whose images it removed can't be rolled back to afterwards (image_removed). Nothing restarts. 409 disk_clean_running while one runs; 409 deploy_running while a deploy runs on the host. A server that can't be reached shows as a failed clean (GET …/disk/clean). Audited as server.disk_cleaned when it ends."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskCleanInput'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskClean'
                required:
                  - data
                type: object
          description: Started.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/disk/volumes/remove:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Servers]
      operationId: removeServerDiskVolume
      summary: Delete one volume no service owns (D-135)
      description: "Owners of the server's workspace (D-128), sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Deletes the named volume with its data, never forced. Only a volume the last read listed (a deleted service's, a compose project no service deploys, or an anonymous volume no container mounts) and still unowned: 409 volume_not_removable otherwise; 409 volume_in_use when a container mounts it; 409 disk_clean_running; 502 server_unreachable. Audited as server.volume_removed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskVolumeRemoveInput'
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/servers/{serverID}/disk/policy:
    parameters:
      - name: serverID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Servers]
