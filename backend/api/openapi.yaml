    NeedsYouItem:
      type: object
      required: [key, kind, category, title, detail, at, project_id, project, severity, snoozes]
      properties:
        key:
          type: string
          description: The item and its version, to mark it done.
        snoozes:
          type: boolean
          description: "It is a condition: marking it done puts it off for 7 days instead of hiding it while it holds."
        snoozed_until:
          type: string
          format: date-time
          nullable: true
          description: When a condition the caller marked done comes back; null for anything else.
        severity:
          type: string
          enum: [problem, waiting, warning, request]
          description: "How much it needs someone (D-140), the list's order. problem: something broken (a failed deploy, a failed panel upgrade; alerts server_unreachable, agent_offline, backup_failed, service_down, container_exited, panel_container, mirror_failing, agent_frozen, service_restarting). waiting: an agent's request, which expires. warning: the other alerts, exposed_tool, setup_login, https_redeploy, no_backup, no_watchdog, kit_out_of_date. request: preview_approval, assigned, due, stale_page."
        kind:
          type: string
          enum: [deploy_failed, alert, assigned, due, stale_page, preview_approval, agent_approval, exposed_tool, no_backup, no_watchdog, kit_out_of_date, https_redeploy, setup_login, upgrade_failed]
          description: "no_watchdog: this panel has no watchdog URL, for instance operators; a mark puts it off for 7 days. kit_out_of_date (D-163): Setup.kit_out_of_date, for instance operators; gone when the current kit is acknowledged, and a mark puts it off for 7 days. upgrade_failed: the panel's last upgrade rolled back or stopped, for instance operators; title is Upgrade to v0.40.0 failed and rolled back (stopped: Upgrade to v0.40.0 failed), detail which release runs, error the upgrade's; gone when a later upgrade succeeds. setup_login: a catalog app whoever opens first becomes the admin of (the template's setup_login) with basic auth still on; service_id names it, title is Set up uptime’s admin account, then turn off its temporary login, for owners and developers; gone when its basic auth is off. https_redeploy (D-159): a running service whose temporary (sslip.io) address got its certificate after its live deployment started, which serves it over plain HTTP, when Toft did not redeploy it itself (a protected environment, settings saved since, a stack it cannot bring up unchanged); service_id names it, title is Redeploy web to switch it to HTTPS (behind basic auth, whose address redirects to HTTPS already and whose TOFT_URL still says http://: Redeploy web to give it its HTTPS address), for owners and developers. no_backup (D-43): a server with no backup destination (nor another entry for the same machine with one) that holds the workspace's databases or volumes (an inline compose file's counted inside it; a compose file in a repository counts as a compose stack); server_id names it, and is absent for the panel host, which for an instance operator also counts Toft's own database; detail says what is at risk, as 2 databases, 3 volumes, no backups; for owners and developers (operators: the panel host's). exposed_tool: an admin tool (phpMyAdmin, Adminer, pgAdmin, Mailpit, MailHog, RedisInsight; the service's kind is tool) anyone can open at its address, with neither basic auth nor an IP allowlist; service_id names it, for owners and developers. due (D-90): an open issue assigned to the caller, due by tomorrow in the workspace's time zone. preview_approval (D-97): a preview waiting for an owner or developer to approve sha, its pull request's head. agent_approval (D-100): an agent's call waiting for an owner or developer (approval_id), until expires_at; title is what it asks, as Deploy storefront / api in production."
        category:
          type: string
          enum: [deploys, code, issues, docs, servers]
        title:
          type: string
        detail:
          type: string
        error:
          type: string
          description: A failed deploy's or panel upgrade's error.
        at:
          type: string
          format: date-time
        project_id:
          type: string
          nullable: true
        project:
          type: string
        service_id:
          type: string
        deployment_id:
          type: string
        server_id:
          type: string
        issue:
          $ref: '#/components/schemas/InboxIssue'
        page_id:
          type: string
        issue_key:
          type: string
          description: A failed deploy's open issue, when it has one.
        alert_kind:
          type: string
        repository_id:
          type: string
        repository:
          type: string
        pull_number:
          type: integer
        sha:
          type: string
        approval_id:
          type: string
        expires_at:
          type: string
          format: date-time
    Preview:
      type: object
      required: [pull_number, repository_id, repository, title, branch, environment, copies, status, untrusted, head_sha, needs_approval, services, reached, migration_files, migrations_unchecked, created_at, updated_at]
      properties:
        pull_number:
          type: integer
        repository_id:
          type: string
        repository:
          type: string
        title:
          type: string
        branch:
          type: string
        environment:
          description: Its environment (pr-42), once started.
          nullable: true
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        copies:
          type: string
          description: The name of the environment it copies.
        status:
          type: string
          enum: [needs_approval, waiting_room, blocked, starting, updating, running, failed, stopped, removing]
        note:
          type: string
          description: Why it can't start, or what stopped it.
        blocked:
          type: string
        untrusted:
          type: boolean
          description: Opened or pushed to with an API key; runs Sandboxed, alone, with no secrets, and each commit waits for approval.
        head_sha:
          type: string
        approved_sha:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        needs_approval:
          type: boolean
        stopped_reason:
          type: string
          enum: [room, manual]
        opened_with_key:
          type: object
          required: [key, owner]
          properties:
            key:
              type: string
            owner:
              type: string
            agent:
              type: string
              description: The agent that opened it for owner, when one did (D-102); no key did then.
        services:
          type: array
          items:
            $ref: '#/components/schemas/PreviewService'
        reached:
          type: array
          description: The copied environment's services it reaches by name (none for an untrusted one).
          items:
            type: string
        migration_files:
          type: array
          description: "The migrations the pull request's diff touches at the commit it last started or updated to, by path (the first 50; empty when none). A preview never runs its services' migrate or pre-deploy commands (D-144), so Toft didn't run them; a post-deploy command or an image's entrypoint still runs. A path counts under migrations/, migrate/, db/migration/, db/changelog/ or alembic/versions/, named schema.sql or schema.prisma, or ending in .hcl."
          items:
            type: string
        migrations_unchecked:
          type: boolean
          description: True when the pull request's diff at that commit was too large to check for migrations (over 3,000 files), so migration_files may be incomplete. False again once a later commit's diff fits.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PreviewService:
      type: object
      required: [id, name, server, status, addresses, isolation]
      properties:
        id:
          type: string
        name:
          type: string
        server:
          type: string
        status:
          type: string
          enum: [starting, running, failed, stopped]
        sha:
          type: string
        error:
          type: string
          description: Why its last deploy failed. On a running service, why the approved commit was refused; sha is what keeps running.
        deployment_id:
