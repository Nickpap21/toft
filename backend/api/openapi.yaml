      operationId: putServerDiskPolicy
      summary: Change the disk policy (D-135)
      description: "Owners of the server's workspace (D-128), sessions only; nothing is deleted when it is saved. Replaces the whole policy: a field sent as null goes back to its default. 400 invalid_policy for a value out of range. Audited as server.disk_policy_changed with the old and new values."
      requestBody:
