  /{workspace}/{repo}/info/refs:
    parameters:
      - $ref: '#/components/parameters/GitWorkspace'
      - $ref: '#/components/parameters/GitRepo'
    get:
      tags: [Code]
      operationId: getGitInfoRefs
      summary: "git's smart HTTP: the ref advertisement"
      description: "git's wire protocol, not JSON: what `git clone https://<panel>/<workspace>/<repository>.git` calls first. Basic auth with an API key as the password; without one, 401 with WWW-Authenticate. A repository the key's account can't read is 404; one it may read but not push to is 403 for git-receive-pack, as is an agent's push its credential no longer allows (agents paused, its branch now deployed or the default one). Git-Protocol: version=2 is passed to git."
      security:
        - gitBasic: []
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
            enum: [git-upload-pack, git-receive-pack]
      responses:
        "200":
          description: "The advertisement (application/x-git-<service>-advertisement)."
          content:
            application/x-git-upload-pack-advertisement:
              schema:
                type: string
                format: binary
            application/x-git-receive-pack-advertisement:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/GitRefusal'
        "403":
          $ref: '#/components/responses/GitRefusal'
        "404":
          $ref: '#/components/responses/GitRefusal'
        "503":
          $ref: '#/components/responses/GitRefusal'
        "429":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/GitRefusal'
  /{workspace}/{repo}/git-upload-pack:
    parameters:
      - $ref: '#/components/parameters/GitWorkspace'
      - $ref: '#/components/parameters/GitRepo'
    post:
      tags: [Code]
      operationId: postGitUploadPack
      summary: "git's smart HTTP: fetch and clone"
