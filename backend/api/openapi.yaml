    post:
      tags: [Code]
      operationId: addPushMirror
      summary: Add a push mirror
      description: "Owners, with X-Toft-Reauth (D-79): a push mirror copies all of the repository's code out of Toft. Seconds after each push, merge or tag, and at once when added, Toft force-pushes every branch and tag to the URL and deletes the branches and tags there that the repository doesn't have, so the remote ends up exactly like it. A failure is retried after 1, 2, 4 … minutes, at most an hour apart; three in a row raise the mirror_failing alert. The URL is HTTPS on a public address; the credentials are stored encrypted and never returned. 400 bad_url, private_address; 409 mirror_limit (5 a repository); 403 reauth_required. In the audit log."
