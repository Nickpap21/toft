        name:
          type: string
        type:
          type: string
        source_type:
          type: string
        git_repo_url:
          type: string
        git_branch:
          type: string
        repository_id:
          type: string
          description: "One of the project's repositories the service builds from, or takes its compose files from, instead of git_repo_url or compose_repo_url (D-77); empty for a URL."
        deploy_on_push:
          type: boolean
          description: A push to git_branch deploys it (a push to repository_id, or GitHub's webhook for git_repo_url).
        base_directory:
          type: string
        docker_image:
          type: string
        install_command:
          type: string
        build_command:
          type: string
        start_command:
          type: string
        build_pack:
          type: string
        port:
          type: integer
        replicas:
          type: integer
        cpu_limit:
          type: string
        memory_limit:
          type: string
        runtime_status:
          type: string
        active_deployment_id:
          type: string
        live_since:
          type: string
          format: date-time
          nullable: true
          description: When the live deployment finished; null without one. Not the container's uptime, which a restart resets.
        compose_content:
          type: string
        compose_repo_url:
          type: string
        compose_file_path:
          type: string
        compose_route_service:
          type: string
        deploy_strategy:
          type: string
        effective_deploy_strategy:
          type: string
