  /api/v1/instance/panel/updates/run:
    get:
      tags: [Instance]
      operationId: getInstancePanelUpdateRun
      summary: The run of updates in progress, or the last one (D-134)
      description: Operators only. While a run lasts this reads its state from the host, so poll it; afterwards it is the stored outcome. data is null before the first run.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/UpdateRun'
                    nullable: true
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Instance]
      operationId: startInstancePanelUpdateRun
      summary: Install updates, update Docker or reboot (D-134)
      description: "Operators only, sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Starts the action on the host as the transient systemd unit toft-host-update and answers at once; the run goes on when the panel, the SSH connection or the agent restarts, and GET …/updates/run follows it. install refreshes apt's lists and installs every pending update with Docker's packages held for that run only, keeping changed config files; docker installs the newer Docker packages, restarting every container on the host; reboot restarts the host. When it ends the updates are read again. 409 update_running while a run lasts; 409 deploy_running for docker or reboot while a deploy runs on the host; 409 nothing_pending when the last read found nothing for install or docker to install; 409 docker_not_packaged when Docker wasn't installed from a package; 409 upgrade_running while the panel upgrades; 502 server_unreachable when the host helper couldn't start it; on the panel's own server docker and reboot take the panel down with the host until Docker starts it again. Audited as panel.updates_started, then panel.updates_succeeded or panel.updates_failed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunInput'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UpdateRun'
                required:
                  - data
                type: object
          description: Started.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel/disk:
    get:
      tags: [Instance]
      operationId: getInstancePanelDisk
      summary: What fills the disk, and what is safe to delete (D-135)
      description: "Operators only. Reads Docker's disk use on the panel's own server through the Docker API (at most every 5 minutes; ?fresh=true reads again) and classes every image: kept (in use by a container; the images of each service's last N live deployments, N being its rollback_images_kept; on the panel's server its running release and the one before) or removable (untagged; old builds; old panel releases; pulled images no kept deployment names). Volumes no service owns are listed one by one. 502 server_unreachable when Docker can't be reached."
      parameters:
        - name: fresh
          in: query
          required: false
          description: Read again now instead of within the last 5 minutes.
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskReport'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel/disk/clean:
    get:
      tags: [Instance]
      operationId: getInstancePanelDiskClean
      summary: The clean in progress, or the last one (D-135)
      description: Operators only. data is null before the first clean.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DiskClean'
                    nullable: true
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Instance]
      operationId: startInstancePanelDiskClean
      summary: Delete the removable classes ticked (D-135)
      description: "Operators only, sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Reads the disk again, then removes the images of the kinds sent, by ID and never forced (Docker keeps an image a container started from in the meantime), and with build_cache_all the whole build cache; answers at once and GET …/disk/clean follows it. Deployments whose images it removed can't be rolled back to afterwards (image_removed). Nothing restarts. 409 disk_clean_running while one runs; 409 deploy_running while a deploy runs on the host. A server that can't be reached shows as a failed clean (GET …/disk/clean). Audited as panel.disk_cleaned when it ends."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskCleanInput'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskClean'
                required:
                  - data
                type: object
          description: Started.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel/disk/volumes/remove:
    post:
      tags: [Instance]
      operationId: removeInstancePanelDiskVolume
      summary: Delete one volume no service owns (D-135)
      description: "Operators only, sessions only, with X-Toft-Reauth (403 reauth_required; session_required for an API key). Deletes the named volume with its data, never forced. Only a volume the last read listed (a deleted service's, a compose project no service deploys, or an anonymous volume no container mounts) and still unowned: 409 volume_not_removable otherwise; 409 volume_in_use when a container mounts it; 409 disk_clean_running; 502 server_unreachable. Audited as panel.volume_removed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskVolumeRemoveInput'
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "502":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel/disk/policy:
    get:
      tags: [Instance]
      operationId: getInstancePanelDiskPolicy
      summary: The disk policy, with its defaults (D-135)
      description: Operators only.
      responses:
        "200":
