              x-enum-varnames: [CreatedServiceContainerHealthImage, CreatedServiceContainerHealthOff, CreatedServiceContainerHealthCommand]
            deployment:
              description: "The first deploy, started because the create sent deploy (the 202 of POST /services/{serviceID}/deployments)."
              allOf:
                - $ref: '#/components/schemas/Deployment'
            deploy_error:
