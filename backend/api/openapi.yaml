          nullable: true
          description: Null when the commit has no checks.
        checks:
          type: array
          description: Toft's own first, then by name.
          items:
            $ref: '#/components/schemas/CommitCheck'
    CommitCheckInput:
      type: object
      required: [name, state]
      properties:
        name:
