  /api/v1/services/{serviceID}/deployments:
    parameters:
      - name: serviceID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Deployments]
      operationId: getServicesServiceidDeployments
      summary: A service's deployments, newest first
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Deployment'
                    type: array
                  next:
