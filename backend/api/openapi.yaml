        - description: Several actions, comma-separated.
          in: query
          name: actions
          schema:
            type: string
        - description: The actor's user ID.
          in: query
          name: actor
          schema:
            type: string
        - description: Free text over actions and targets.
          in: query
          name: q
          schema:
            type: string
        - description: One resource exactly, as written (service:<id>).
          in: query
          name: resource
          schema:
            type: string
        - description: "Agents (D-100): any (agents only), none (people only), or an agent connection's ID."
          in: query
          name: agent
          schema:
            type: string
        - $ref: '#/components/parameters/AuditAPIKeyQuery'
        - description: 'RFC 3339: entries at or after this time.'
          in: query
          name: since
          schema:
            type: string
        - deprecated: true
          description: 'Older: the cursor''s time. Use cursor.'
          in: query
          name: before
          schema:
            type: string
        - deprecated: true
          description: 'Older: the cursor''s entry ID. Use cursor.'
          in: query
          name: before_id
          schema:
            type: string
        - description: 'Page size: 50 by default, 200 at most.'
          in: query
          name: limit
