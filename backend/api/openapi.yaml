          items:
            type: string
        fast_forward:
          type: boolean
          description: base is where head left it, so base can simply move to head.
        commits:
          type: array
          description: The first 250 commits head adds, oldest first.
          items:
            $ref: '#/components/schemas/GitCommit'
        commits_truncated:
