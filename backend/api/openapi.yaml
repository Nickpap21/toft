openapi: 3.0.3
info:
  title: Toft API
  version: 1.0.0
  description: |
    The HTTP API of one Toft instance: the same calls the panel, the `toft`
    CLI and (later) the MCP tools make. This document is the source of
    truth; a route the server mounts without it fails the test suite, and
    the page you are reading is served by the instance itself, so it always
    describes the version running here.

    ## Authentication

    Every request except the public ones carries `Authorization: Bearer <token>`.

    - **A session token** from `POST /api/v1/auth/login` (the panel's sign-in).
      Some changes need a recent password confirmation on top: `POST /api/v1/auth/reauth`
      answers a proof to send as `X-Toft-Reauth` for ten minutes (host shells,
      host keys, deploy-policy exceptions). Changes to accounts and operators
      ask for the password in the body every time.
    - **An API key** (`paas_…`) from Settings → API keys, for CI and scripts.
      A full-access key acts as its owner in the workspace it was made in; a
      project-scoped key reaches only that project's deploys, variables,
      code (`code_read`, or `code_write`, which includes it), issues
      (`issues_read`, or `issues_write`, which includes it) and docs
      (`docs_read`, or `docs_write`, which includes it). A project key may
      also name some of the project's services: it then deploys and sets
      variables on those services only. A key past its `expires_at` gets
      `401 api_key_expired`.
      Keys can't do what needs a password.

    ## The workspace

    An account can belong to several workspaces. Send `X-Toft-Org: <workspace id>`
    to say which one a request is about; without it the account's default
    workspace is used. The panel sends it on every request, so each tab works
    in the workspace it shows. `GET /api/v1/org/list` lists yours.

    ## Answers

    Success is `{"data": …}` (or `204` with no body). A list that can grow
    answers a page: `{"data": [...], "next": "<cursor>"}`. Send `?cursor=` with
    that value for the next page and `?limit=` (50 by default, 200 at most) for
    the size; `next` is absent on the last page.

    A read of a list that a write replaces whole also answers `version` beside
    `data`. Send that value back with the write. Without it the write gets
    `400 version_required`; if the list has changed since,
    `409 changed_since_read`, and nothing is written.

    An error is a problem (RFC 9457) inside the same envelope:

    ```json
    {"status": 403, "title": "Forbidden", "detail": "confirm your password to continue",
     "code": "reauth_required", "type": "https://toft.dev/problems/reauth_required",
     "error": "confirm your password to continue", "data": {"code": "reauth_required"}}
    ```

    Read `code` and `detail`. `error` and `data.code` are the older spelling
    and stay until `/api/v2`. A `422 deploy_policy_violation` also lists
    `data.violations`. A `429` carries `Retry-After`.

    ## Streams

    Logs, deployment progress, provisioning and the event feed are
    server-sent events (`text/event-stream`). A deployment's stream ends with
    `event: done` and `{"status": "running" | "failed" | …}`. The host terminal
    is a WebSocket.

    ## Deploy from CI

    ```sh
    export TOFT_URL=https://api.toft.example TOFT_API_KEY=paas_… TOFT_ORG=<workspace id>
    toft deploy storefront/production/api --image "$GITHUB_SHA" --wait
    ```

    Or with curl:

    ```sh
    curl -X POST "$TOFT_URL/api/v1/services/<service id>/deployments" \
      -H "Authorization: Bearer $TOFT_API_KEY" -H "X-Toft-Org: $TOFT_ORG" \
      -H "Content-Type: application/json" -d '{"image_tag": "1.2.3"}'
    ```

    The answer is `202` with the deployment; follow
    `GET …/deployments/<id>/logs/stream` until `done`.

    ## Versioning

    `/api/v1` stays. Fields and endpoints are added without a version bump.
    From 1.0, a breaking change ships as `/api/v2` beside v1 with a
    two-release window and `Deprecation`/`Sunset` headers. Before 1.0 a minor
    release may change v1, and its changelog entry says how.
    `GET /version` names the release.
servers:
  - url: /
security:
  - session: []
  - apiKey: []
tags:
  - name: Authentication
    description: "Sign in, sign up from an invite, confirm the password."
  - name: Account
    description: "The signed-in account: profile, password, theme."
  - name: API keys
    description: "Keys for CI and scripts."
  - name: Workspace
    description: "The workspace of the request: members, invites, audit log, settings."
  - name: Instance
    description: "Operators and accounts of the whole instance; operators only."
  - name: Projects
    description: "A workspace's projects."
  - name: Environments
    description: "A project's environments, with colour and protection."
  - name: Services
    description: "Services, their configuration, containers, logs and metrics."
  - name: Deployments
    description: "Deploys, their logs and rollbacks."
  - name: Variables and secrets
    description: "On a service or on an environment; secrets are write-once."
  - name: Config files
    description: "Files mounted into a service's containers."
  - name: Domains
    description: "A service's domains and their DNS checks."
  - name: Shared volumes
    description: "Volumes several services mount."
  - name: Resources
    description: "Limits, usage and suggestions."
  - name: Deploy policy
    description: "What a deploy may ask of its server, and the exceptions."
  - name: Servers
    description: "The workspace's servers: SSH, provisioning, capacity, host keys, DNS, backups, shares."
  - name: Observability
    description: "Loki, Grafana and Prometheus settings."
  - name: Alerts
    description: "The alert webhook and recent alerts."
  - name: Catalog
    description: "Add-on templates."
  - name: Dashboard
    description: "The workspace's home."
  - name: Versions
    description: "Tags, branches and images a service can deploy."
  - name: Webhooks
    description: "GitHub push webhooks."
  - name: Events
    description: "The live event feed."
  - name: Health
    description: "Liveness, and this document."
  - name: Code
    description: "Git hosting (D-71): a project's repositories, the account's SSH keys, and git's smart HTTP at https://<panel>/<workspace>/<repository>.git. A repository's reads (the repository, its tree, files, commits, branches, tags and pull requests) answer 503 git_unavailable while the instance's git server isn't listening, as while it restarts; try again once it is back."
  - name: Previews
    description: "A pull request's preview environment (D-07, D-97): a project's previews settings, its open previews, and starting, approving, stopping and redeploying one."
  - name: Issues
    description: "A project's issues, moved by pushes, pull requests and deploys (D-06, D-81), and ⌘K's search."
  - name: Docs
    description: "A project's pages, connected to its services, issues and pull requests (D-86)."
  - name: Inbox
    description: "A person's Needs you and updates (D-88)."
  - name: Agents
    description: "Agents over MCP (D-17, D-100): Toft's OAuth authorization server, the MCP endpoint, connected agents, the workspace's agent policy, requests waiting for a person, and pause-all."
paths:
  /api/v1/git:
    get:
      tags: [Code]
      operationId: getGit
      summary: Whether this instance hosts git, and how to reach it over SSH
      description: "enabled is false when the operator installed Toft without git (TOFT_GIT=off); the other fields are then absent. host_key_fingerprint is the SSH host key's SHA256 fingerprint, for checking the first connection."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GitInfo'
                required:
                  - data
                type: object
          description: OK.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Code]
      operationId: getProjectsProjectidRepositories
      summary: The project's git repositories, with their clone URLs
      description: "A project has one or more repositories (D-71, D-75), the first made with it. 404 with code git_off when git hosting is off."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Repository'
                    type: array
                required:
                  - data
                type: object
          description: OK.
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Code]
      operationId: createRepository
      summary: Add an empty repository to the project
      description: "Owners and developers (D-75). The name is lowercase letters, digits, '.', '-' and '_', unique in the workspace, and part of the clone URL. 409 name_taken; 400 bad_name."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryInput'
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Repository'
                required: [data]
                type: object
          description: Created.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepository
      summary: A repository, with its default branch and how many branches and tags it has
      description: "Every member of the workspace reads a repository; a project key needs code_read or code_write (D-73). 404 when the repository isn't the project's, or with code git_off when git hosting is off."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/RepositoryDetail'
                required: [data]
                type: object
          description: OK.
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Code]
      operationId: updateRepository
      summary: Change the default branch or its protection
      description: "Owners (D-75). default_branch must be a branch; protect_default_branch refuses pushes to it (merging a pull request is the only way it changes). Protection is kept by the branch's name, and moves with the default branch. Changing default_branch, and turning protection off, need X-Toft-Reauth: 403 reauth_required without it, 403 session_required with an API key. Both are in the audit log."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUpdate'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/RepositoryDetail'
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Code]
      operationId: deleteRepository
      summary: Delete a repository with its branches, tags and pull requests
      description: "Owners, with X-Toft-Reauth and the repository's name in confirm (D-75). 409 last_repository: a project keeps at least one; 409 repository_in_use, with services naming those that build from it (D-77). In the audit log."
      parameters:
        - name: confirm
          in: query
          required: true
          description: The repository's name.
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/branches:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryBranches
      summary: The repository's branches, the default first, then the most recently committed to
      description: "ahead and behind count commits against the default branch; null when the default branch has no commits."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/GitBranch'
                    type: array
                  next:
                    description: The cursor of the next page, as ?cursor=; absent on the last page.
                    type: string
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Code]
      operationId: createBranch
      summary: Make a branch
      description: "Owners and developers (D-102). A new branch at from (a branch, tag or commit; the default branch when empty); 409 branch_exists for one that exists, 403 branch_deployed for a name a service deploys from, 409 mirror_read_only on a mirror. An agent gets push: a credential (toft_agt_, 24 hours) that pushes over HTTPS to this branch alone and fetches the repository; calling it again on a branch the agent made issues a new one and makes no branch. Under the agent policy's code row (create_branch)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchInput'
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CreatedBranch'
                required: [data]
                type: object
          description: The branch.
        "202":
          $ref: '#/components/responses/ApprovalPending'
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "429":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryTags
      summary: The repository's tags, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/GitTag'
                    type: array
                  next:
                    description: The cursor of the next page, as ?cursor=; absent on the last page.
                    type: string
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryTree
      summary: A directory at a branch, tag or commit, with each entry's last commit and the README
      description: "Directories first, then files, by name; 1,000 entries at most (truncated says when there were more). An entry's last_commit is null when finding it took too long. 400 bad_ref or bad_path; 404 ref_not_found, path_not_found, not_a_directory, or empty for a repository with no commits; 503 git_busy with Retry-After."
      parameters:
        - $ref: '#/components/parameters/RefQuery'
        - $ref: '#/components/parameters/PathQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GitTree'
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/blob:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryBlob
      summary: A file at a branch, tag or commit
      description: "The first 1 MiB of a text file (truncated says when there was more); a binary file (a NUL in its first 8,000 bytes) has no text. Markdown files also come rendered as html, sanitised on the server: no raw HTML, no script links, relative links and images carry data-toft-path for the panel to resolve. 404 not_a_file for a directory or a submodule."
      parameters:
        - $ref: '#/components/parameters/RefQuery'
        - $ref: '#/components/parameters/PathQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GitBlob'
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/raw:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryRaw
      summary: A file's bytes
      description: "Served so a browser never runs it (D-71, D-73): always Content-Security-Policy sandbox, X-Content-Type-Options nosniff and Cross-Origin-Resource-Policy same-origin. Text (SVG and HTML included) is text/plain; PNG, JPEG, GIF and WebP images their own type; anything else application/octet-stream as an attachment."
      parameters:
        - $ref: '#/components/parameters/RefQuery'
        - $ref: '#/components/parameters/PathQuery'
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The file's bytes.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/commits:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
    get:
      tags: [Code]
      operationId: getRepositoryCommits
      summary: The commits reachable from a branch, tag or commit, newest first, optionally only those touching a path
      description: "A cursor keeps the commit the first page started from, so pages stay in step while the branch moves."
      parameters:
        - $ref: '#/components/parameters/RefQuery'
        - $ref: '#/components/parameters/PathQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/GitCommit'
                    type: array
                  next:
                    description: The cursor of the next page, as ?cursor=; absent on the last page.
                    type: string
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/commits/{sha}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
      - $ref: '#/components/parameters/CommitSHA'
    get:
      tags: [Code]
      operationId: getRepositoryCommit
      summary: One commit, with the files it changed against its first parent
      description: "3,000 files at most (files_truncated says when there were more); stats count every file."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GitCommitDetail'
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/commits/{sha}/diff:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
      - $ref: '#/components/parameters/CommitSHA'
    get:
      tags: [Code]
      operationId: getRepositoryCommitDiff
      summary: A commit's changes, file by file, in the order of its files
      description: "patch is the file's hunks in unified form, from its first @@ line; empty for a binary file or a change of mode alone; cut at 512 KiB (patch_truncated). Pages hold 20 files by default, 50 at most."
      parameters:
        - description: 'Files per page: 20 by default, 50 at most.'
          in: query
          name: limit
          schema:
            type: integer
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/GitFileDiff'
                    type: array
                  next:
                    description: The cursor of the next page, as ?cursor=; absent on the last page.
                    type: string
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{projectID}/repositories/{repositoryID}/commits/{sha}/checks:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/RepositoryID'
      - $ref: '#/components/parameters/CommitSHA'
    get:
      tags: [Code]
      operationId: getCommitChecks
      summary: A commit's checks, and their state together
      description: "Every member of the workspace; project keys with code_read, code_write or checks (D-77). External CI reports checks by name; every deploy of a service that builds from the repository reports one named toft/deploy/<environment>/<service>, linked to its deployment. 404 commit_not_found when the repository has no such commit."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommitChecks'
                required: [data]
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "503":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Code]
      operationId: reportCommitCheck
      summary: Report a check on a commit, or update it by name
      description: "Owners and developers, full-access API keys, and project keys with the checks scope (D-77): what an external CI uses. The commit is named by its full SHA. Reporting a name the commit has updates that check: started_at is set when it first runs, completed_at when it ends. 201 for a new check, 200 for an update. 400 bad_check_name (1 to 100 characters, no control characters), reserved_name (toft/ is Toft's own), bad_state, bad_url (http or https, 2,000 characters at most), bad_description (300 characters at most), bad_sha (a full SHA); 404 commit_not_found; 422 too_many_checks (100 per commit); 429 with Retry-After past 120 a minute per repository."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitCheckInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/CommitCheck'
                required: [data]
                type: object
          description: Updated.
        "201":
          content:
