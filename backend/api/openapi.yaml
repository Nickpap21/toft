  /api/v1/instance/upgrade:
    get:
      tags: [Instance]
      operationId: getInstanceUpgrade
      summary: The panel's version, the newest release, and the upgrade in progress or the last one
      description: Operators only (D-68). Read from toft's own files on the host, so it follows an upgrade whoever started it, from here or the command line. Poll it while run.outcome is running; the panel restarts during the restart step, so a request can fail for a few seconds.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UpgradeStatus'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Instance]
      operationId: postInstanceUpgrade
      summary: Upgrade the panel to the newest release
      description: 'Operators only, sessions only (session_required), with the operator''s password (wrong_password is 403). Starts toft upgrade on the host as a transient systemd unit and answers at once; it saves the database, migrates it, restarts the panel and rolls back by itself when the new release isn''t healthy. 409 deploy_sh on a panel set up with deploy.sh, 409 upgrade_running, 409 update_running while a run of updates lasts on the panel''s server (D-134), 400 bad_release unless to is the newest release and newer than the one running.'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UpgradeStatus'
                required:
                  - data
                type: object
          description: Started.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        "429":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartUpgradeInput'
        required: true
