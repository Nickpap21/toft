      - $ref: '#/components/parameters/RepositoryID'
    post:
      tags: [Code]
      operationId: importRepository
      summary: Import every branch and tag from another host into this empty repository
      description: "Owners and developers (D-79). The URL is HTTPS on a public address, with no user, query or fragment; a private repository's username and token or password go in their own fields, are stored encrypted, sent only to that host and never returned. Toft reads the remote's branches and tags first, then copies them with their history and points the default branch where the remote's points; pull requests, issues, releases and LFS objects stay where they are. With keep it then pulls every 10 minutes as a pull mirror, and the repository is read-only until the mirror is stopped; without it the credentials are dropped when the import succeeds. The import runs in the background: 202 with the pull mirror, whose state reads importing, then ok or failed (GET the repository or its mirrors). Importing again replaces an import that failed. 400 bad_url, private_address; 409 not_empty (the repository has a branch), import_running (an import or a pull mirror is set); 404 git_off. In the audit log."
