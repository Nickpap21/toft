        id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        user_email:
          type: string
        user_name:
          type: string
        role:
          type: string
          enum: [owner, developer, viewer]
        created_at:
          format: date-time
          type: string
    AddMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          type: string
    AddableAccount:
      type: object
      required: [user_id, name, email, former, former_role, left_at]
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        former:
          type: boolean
        former_role:
          type: string
          enum: [owner, developer, viewer, ""]
