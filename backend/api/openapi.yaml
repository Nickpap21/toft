  /api/v1/instance/setup:
    get:
      tags: [Instance]
      operationId: getInstanceSetup
      summary: Where the setup wizard stands
      description: Operators only. An instance is in setup from its first account until the wizard finishes (D-62); an install set up before the wizard existed never is.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Setup'
                required:
                  - data
                type: object
          description: OK.
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Instance]
      operationId: patchInstanceSetup
      summary: Skip a step, acknowledge the recovery kit, or finish setup
      description: Operators only, sessions only (session_required). Finishing needs the server role and the recovery kit (409 setup_incomplete). With a panel domain it also fetches this panel's probe through that domain, unless domain_checked is true. Finishing stops the panel answering on its IP address, so a domain that doesn't reach this panel is refused (409 panel_domain_unreachable) and nothing changes. Acknowledging the kit names the kit that was read by its fingerprint (400 without one); when the encryption key or the panel host's backup settings changed after that read, the kit on the operator's screen is not the one a restore needs, so it is refused (409 kit_changed) and nothing is recorded, until the kit is read again (D-163).
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Setup'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupPatch'
        required: true
  /api/v1/instance/setup/domain:
    put:
      tags: [Instance]
      operationId: putInstanceSetupDomain
      summary: Set the panel's domain, or keep it on the IP address
      description: Operators only. Needs X-Toft-Reauth (403 reauth_required without it; session_required for an API key). Rewrites the panel's routes at once; Let's Encrypt is asked for a certificate when the domain is first reached. After setup a domain stops the panel answering on its IP address at once, so one that doesn't reach this panel is refused (409 panel_domain_unreachable) and nothing changes, unless domain_checked is true. Saving the domain the panel already has, while awaiting_domain is true, stops a restored panel answering on its IP address and keeps the domain (D-164). A save that changes the domain is recorded in the instance audit log as panel.domain_changed, and one that only ends the IP answer as panel.ip_answer_stopped; the same domain saved again with nothing to end is not recorded (D-62). When the routes can't be written the save is put back, the request fails and that is recorded as panel.domain_change_failed. On the panel host, `toft answer-on-ip` starts a restored panel's IP answer again (panel.ip_answer_restored, D-165).
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Setup'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPanelDomainInput'
        required: true
  /api/v1/instance/setup/domain-check:
    post:
      tags: [Instance]
      operationId: postInstanceSetupDomainCheck
      summary: Check a domain for the panel - DNS, whether it reaches this panel, its certificate
      description: Operators only. Changes nothing; the wizard polls it while Let's Encrypt issues the certificate.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PanelDomainCheck'
                required:
                  - data
