      parameters:
        - description: 'Page size: 50 by default, 200 at most.'
          in: query
          name: limit
          schema:
            type: integer
        - description: Where the previous page ended, from its `next`; the first page without it.
          in: query
          name: cursor
          schema:
            type: string
    post:
      tags: [Deployments]
      operationId: postServicesServiceidDeployments
      summary: Deploy
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Deployment'
                      - $ref: '#/components/schemas/AgentApprovalPending'
                required:
                  - data
                type: object
          description: OK.
        "409":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CapacityExceededError'
                    required:
                      - data
                    type: object
          description: See the description.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "422":
          $ref: '#/components/responses/Problem'
        "429":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      description: 'Fire and forget: the pipeline runs in the background and the client follows it over the deployment''s log stream. A service created with deploy is already deploying: asked while that first deploy still runs, with no override in its body and nothing it ships changed since, this answers 202 with that deployment and starts none. Under the workspace''s agent policy when an agent''s token calls it (D-100): Ask answers 202 approval_pending (from the MCP tool, which gives a reason) or 403 approval_required; Never 403 agent_policy_never; 422 reason_required; 429 too_many_approvals. 409 capacity_exceeded when the server cannot fit it, a problem whose detail names the server and what is short (Not enough room on qa-node: needs 512 MiB of memory, 0 MiB left of 3.7 GiB.) with the shortfall in data; owners (or developers, by the workspace''s rule) retry with ?force=true to deploy anyway, which the audit log records. The panel''s own server is counted too, in memory, against reservation.apps_memory_bytes of GET /instance/panel-host: only an instance operator deploys past it, and a running service deployed again within the memory it already holds is never refused. 422 deploy_policy_violation lists the violations. 409 sandbox_unavailable when the service runs Sandboxed (D-95) or Sandboxed with a strict network (D-115) and its server can''t run it: no gVisor there, its smoke test failing, the panel''s own server, a server never probed, or, for the strict network, no agent answering names. 409 server_frozen when its server (or, for a move, the server it leaves) kept its own state over a restored panel (D-113). 409 server_not_ready when the target server (for a move, the one it moves to) is still waiting for its first agent (D-153). A service''s deploys run one after the other: asked while another of its deploys is pending or building, this one is accepted (202) and stays pending, its log saying it waits, until that one has ended. 409 service_moving while the service is moving to another server: nothing is queued behind a move.'
      parameters:
        - description: true to deploy past the server's capacity (D-44).
          in: query
          name: force
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerDeploymentInput'
        required: true
