  /api/v1/instance/panel/updates:
    get:
      tags: [Instance]
      operationId: getInstancePanelUpdates
      summary: The panel's own server's pending updates, reboot and Docker, as last read (D-133)
      description: Operators only. Read every 6 hours through the host helper; nothing is installed. data is null before the first read.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
