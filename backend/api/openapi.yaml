          items:
            $ref: '#/components/schemas/AgentProjectPolicy'
    AgentPolicyInput:
      type: object
      required: [cells]
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/AgentPolicyCell'
    AgentPauseState:
