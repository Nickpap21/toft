        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          schema:
            type: string
            enum: [web, worker]
            x-enum-varnames: [GetServicesAddressParamsTypeWeb, GetServicesAddressParamsTypeWorker]
        - name: server_id
          in: query
          schema:
            type: string
        - name: addon_slug
          in: query
          schema:
            type: string
        - name: docker_image
          in: query
          schema:
            type: string
        - name: port
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceAddress'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/events:
    get:
      tags: [Events]
      operationId: getEvents
      summary: The workspace's live event feed
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: A stream; see the description.
        default:
          $ref: '#/components/responses/Problem'
      description: |-
        Server-sent events: service state changes, deployment starts and ends, alerts. Each event's `data` is a JSON object; a deployment event carries `type`.

        `changed` tells the workspace's clients that what their counts and lists read moved, so they refetch. Its `data` is `{"kinds": [...], "project_id": "..."}`. `kinds` holds any of `issues` (an issue was created, changed, closed or moved, by a person, an agent or git), `docs` (a page was created, saved, moved, deleted, restored or verified), `alerts` (an alert opened or resolved), `services` (a service's alert opened or resolved, so its health changed) and `pulls` (a pull request was opened, closed, reopened or merged). `project_id` is present when one project is concerned. A client gets the events of its own changes too. `inbox` carries `{"users": [...]}`: those people's inbox changed.
  /api/v1/instance/audit-log:
    get:
      tags: [Instance]
      operationId: getInstanceAuditLog
      summary: What operators did to the panel, accounts and operators, newest first
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                    type: array
                  next:
                    description: The cursor of the next page, as ?cursor=; absent on the last page.
                    type: string
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - description: 'Page size: 50 by default, 200 at most.'
          in: query
          name: limit
          schema:
            type: integer
        - description: Where the previous page ended, from its `next`; the first page without it.
          in: query
          name: cursor
          schema:
            type: string
        - description: 'panel: what was done to the panel itself, its address, shells, upgrades, recovery kit, first-run setup and pausing agents. accounts: everything else, the changes to accounts and operators. Without it, both.'
          in: query
          name: kind
          schema:
            type: string
            enum: [panel, accounts]
  /api/v1/instance/operators:
