      operationId: getServicesServiceidLogsLive
      summary: Follow the container's logs
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: A stream; see the description.
        "403":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      description: 'Server-sent events: each `data:` line is one log line; the stream ends when the client leaves. Viewers of one container share one stream from the server (K11). A viewer that reads slower than the container writes gets an `error` event, `fell behind the log; reconnect`, and the stream ends. An `error` event starting `no_container:` means the service has no container, and one starting `server_unreachable:` that its server can''t be connected to; any other names no cause.'
      parameters:
        - description: Lines of history first, 100 by default.
          in: query
          name: tail
          schema:
            type: integer
        - description: A compose service's container; the service's when empty.
          in: query
          name: container
          schema:
            type: string
        - description: 1 to prefix each line with its time.
          in: query
          name: timestamps
          schema:
            type: string
  /api/v1/services/{serviceID}/metrics:
    parameters:
      - name: serviceID
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Services]
      operationId: getServicesServiceidMetrics
      summary: CPU and memory samples over a range
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MetricPoint'
                    type: array
                required:
                  - data
                type: object
          description: >-
            OK. One point per collector cycle (a minute), oldest first, its
            containers' CPU and memory summed. For 7d, one point per UTC day:
            the 6 days before today and today so far, timestamp the day's
            start. Its memory is the day's peak and its CPU the day's 95th
            percentile of the same summed samples 1h to 24h draw (a stack's
            compose services summed, or the one compose_service names), and
            throttled_pct the day's highest. A day summarised before this
            was kept has largest_container true: its memory is each compose
            service's largest single container's peak and its CPU each
            compose service's 95th percentile, summed. A day without samples
            is left out, so there may be fewer than 7 points.
        "400":
          $ref: '#/components/responses/Problem'
        "404":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - description: 1h (default), 6h, 24h or 7d (daily points). Any other value reads as 1h.
          in: query
          name: range
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
        - description: One compose service's samples.
          in: query
          name: compose_service
          schema:
            type: string
