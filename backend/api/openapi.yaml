          required: [id, service_id]
          properties:
            id:
              type: string
            service_id:
              type: string
        reporter:
          $ref: '#/components/schemas/Person'
          nullable: true
          description: Who reported it last; null for Toft's own and for a deleted account.
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CommitChecks:
      type: object
      required: [sha, summary, checks]
      properties:
