          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        comments:
          type: integer
        ahead:
          type: integer
          nullable: true
          description: In a list of open ones; null otherwise.
        behind:
          type: integer
          nullable: true
        conflicts:
          type: boolean
          nullable: true
        checks:
          $ref: '#/components/schemas/CheckSummary'
          nullable: true
