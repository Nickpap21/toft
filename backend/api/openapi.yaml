    ProvisionRun:
      type: object
      required: [started_at, started_by, finished_at, ok, error, log, warnings]
      properties:
        started_at:
          format: date-time
          type: string
        started_by:
          type: string
        finished_at:
          format: date-time
          type: string
          nullable: true
        ok:
          type: boolean
          nullable: true
        error:
          type: string
        log:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: "What a run that ended ok left out, to set up with a Re-provision: \"the firewall (ufw, fail2ban)\", \"the host firewall for app containers\", \"nightly backups\", \"automatic security updates\", \"the app network address pool\" (Docker's daemon.json, fixed by hand as the log says). Empty otherwise."
        address_pool_fix:
          type: string
          description: "When warnings has the app network address pool: why it matters and how to set it by hand on the server, the log's own line, as Add \"default-address-pools\":[{\"base\":\"10.203.0.0/16\",\"size\":24}] to its top-level object, run systemctl restart docker (this restarts every container), then Re-provision. Absent otherwise, or when that line is past the log's kept 256 KiB."
    UpdateRunInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [install, docker, reboot]
    UpdateRun:
      type: object
      required: [action, outcome, step, packages, started_at, started_by, finished_at, error, output]
      properties:
        action:
          type: string
          enum: [install, docker, reboot]
        outcome:
          type: string
          enum: [running, rebooting, succeeded, failed]
          description: rebooting while the host restarts; succeeded once it is back on a new boot, failed when it isn't back within 10 minutes.
        step:
          type: string
          enum: [starting, lists, install, reboot, done]
          description: starting until the host has begun it; lists while apt refreshes its package lists; install while apt installs; reboot once the host was told to restart.
        packages:
          type: integer
          description: How many packages apt installs, or installed (0 for reboot, and before apt has worked it out).
        started_at:
          format: date-time
          type: string
        started_by:
          type: string
          description: The name of who started it; empty when they have been deleted.
        finished_at:
          format: date-time
          type: string
          nullable: true
        error:
          type: string
        output:
          type: array
          items:
            type: string
          description: The last lines apt and the run printed, at most 200.
    DiskReport:
      type: object
      description: What fills a host's disk, as Docker's API reads it, and what is safe to delete (D-135).
      required: [read_at, size_bytes, used_bytes, free_bytes, classes, build_cache, volumes, volumes_in_use, containers_bytes, other_bytes, rollback_kept, other_workspaces, policy, clean, last_clean]
      properties:
        read_at:
          format: date-time
          type: string
        size_bytes:
          type: integer
          format: int64
          description: The size of the filesystem holding Docker's data.
        used_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
          description: What df calls Available; the blocks reserved for root are neither used nor free.
        classes:
          type: array
          description: Every image, in exactly one class; kept classes first.
          items:
            $ref: '#/components/schemas/DiskClass'
        build_cache:
          type: object
          required: [bytes, reclaimable_bytes, over_limit_bytes, limit_bytes]
          properties:
            bytes:
              type: integer
              format: int64
            reclaimable_bytes:
              type: integer
              format: int64
              description: What Clear all build cache frees; cache layers images share stay.
            over_limit_bytes:
              type: integer
              format: int64
              description: How far it is over the limit; Toft trims that after the next build or clean.
            limit_bytes:
              type: integer
              format: int64
        volumes:
          type: array
          description: The volumes no service owns, largest first; each is deleted on its own.
          items:
            $ref: '#/components/schemas/DiskVolume'
        volumes_in_use:
          type: object
          required: [count, bytes]
          properties:
            count:
              type: integer
            bytes:
              type: integer
              format: int64
        containers_bytes:
          type: integer
          format: int64
          description: The containers' writable layers.
        other_bytes:
          type: integer
          format: int64
          description: Everything on the filesystem Docker doesn't account for.
        rollback_kept:
          type: array
          description: Per service of the server's workspace with kept rollback images on this host. Other workspaces' services (a shared server) are in other_workspaces.
          items:
            type: object
            required: [service_id, service_name, kept, images, bytes]
            properties:
              service_id:
                type: string
              service_name:
                type: string
              kept:
                type: integer
                description: Its rollback_images_kept, the default applied.
              images:
                type: integer
              bytes:
                type: integer
                format: int64
        other_workspaces:
          type: object
          description: The services other workspaces run on this server (D-39), with no names, IDs or images. All zero when there are none.
          required: [services, rollback_images, rollback_bytes]
          properties:
            services:
              type: integer
            rollback_images:
              type: integer
              description: Rollback images they keep.
            rollback_bytes:
              type: integer
              format: int64
        policy:
          $ref: '#/components/schemas/DiskPolicy'
        clean:
          allOf:
            - $ref: '#/components/schemas/DiskClean'
          nullable: true
          description: The clean in progress, if one runs.
        last_clean:
          allOf:
            - $ref: '#/components/schemas/DiskClean'
          nullable: true
          description: The last clean that ended, by a person or automatic.
    DiskClass:
      type: object
      required: [kind, removable, automatic, count, bytes, examples]
      properties:
        kind:
          type: string
          enum: [in_use, rollback, panel_releases, untagged, old_builds, old_panel_releases, unused_pulled]
          description: in_use, rollback and panel_releases are kept; the others are removable.
        removable:
          type: boolean
        automatic:
          type: boolean
          description: The automatic clean removes this class (the policy's auto_clean).
        count:
          type: integer
        bytes:
          type: integer
          format: int64
          description: What removing the class frees; layers other images share aren't counted.
        examples:
          type: array
          description: Up to 5 of its images, as repository:tag, or the service name for builds. On a server shared with other workspaces, only images of the server's workspace's services.
          items:
            type: string
