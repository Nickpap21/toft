      description: "Owners (D-79). Toft posts JSON to the URL: push for each branch or tag created, moved or deleted (by a push, a merge or a pull mirror; up to 20 commits each, with the total), pull_request when one is opened, pushed to, closed, reopened or merged, and ping from Send test. The body is WebhookPushPayload, WebhookPullRequestPayload or WebhookPingPayload, with a Slack-compatible text line. Headers: X-Toft-Event, X-Toft-Delivery (a UUID, the same on a redelivery) and X-Toft-Signature: sha256=<hex HMAC-SHA256 of the body with the secret>, as alerts are signed. A 2xx is delivered; a 5xx, 429 or no answer in 10 s is retried after 30 s, 2, 10 and 30 minutes; any other answer (redirects are never followed) fails at once. Deliveries are kept 30 days. A ping is sent when the webhook is added. 400 bad_url, private_address (HTTPS on a public address, checked again at each connection), bad_events; 409 webhook_limit (20 a repository). In the audit log."
