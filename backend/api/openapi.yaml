      description: 'Needs X-Toft-Reauth (403 reauth_required without it; session_required for an API key). Replaces an existing exception; recorded in the audit log (D-39, D-53, D-56). Pins the values the service has now for the granted rules (D-124): its saved configuration, and for a compose file from a repository what its last deploy found; keeps the values approved before for rules it still grants, so a rollback to one passes. A deploy whose value differs is refused until an operator grants again. 409 values_changed when values_digest no longer names the service''s values: reload and review them. A grant replaces the rules, so a rule not in the body stops being allowed: `version` is the one from the GET (or the last POST), `400 version_required` when it''s missing, `409 changed_since_read` when the exception has changed since, and nothing is written.'
