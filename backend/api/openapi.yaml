          maxLength: 2048
          description: The HTTPS clone URL, with no user, query or fragment.
        username:
          type: string
          maxLength: 255
        password:
          type: string
          maxLength: 4096
          description: A token or password for a private repository; write-only.
        keep:
          type: boolean
          description: Keep pulling every 10 minutes as a pull mirror (read-only meanwhile).
