      required: [is_active, password]
      properties:
        is_active:
          type: boolean
          nullable: true
        password:
          type: string
          maxLength: 256
    UserUpdate:
      type: object
      required: [id, email, name, is_active, is_operator, created_at, deactivated_at, deactivated_by, workspaces, last_login_at, reset_expires_at, invites_revoked]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        is_operator:
          type: boolean
        created_at:
          format: date-time
          type: string
        deactivated_at:
          format: date-time
          type: string
          nullable: true
        deactivated_by:
          type: string
        workspaces:
          items:
            type: string
          type: array
        last_login_at:
          format: date-time
          type: string
          nullable: true
        reset_expires_at:
          format: date-time
          type: string
          nullable: true
        invites_revoked:
          type: integer
    PasswordReset:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          format: date-time
          type: string
    AuditPerson:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    AuditEntry:
      type: object
      required: [id, action, actor, target, detail, created_at]
      properties:
        id:
          type: string
        action:
          type: string
        actor:
          allOf:
            - $ref: '#/components/schemas/AuditPerson'
          nullable: true
        target:
          allOf:
            - $ref: '#/components/schemas/AuditPerson'
          nullable: true
        detail:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
    UpgradeStatus:
      type: object
      required: [install, current, latest, available, checked_at, check_error, notes_url, since, run, dumps, last_dump_at]
      properties:
        install:
          type: string
          enum: [installer, deploy_sh]
          description: installer upgrades from the panel; deploy_sh upgrades with deploy.sh until it is moved to the installer.
        current:
          type: string
          description: The release the panel runs; "dev" for a build that is not one.
        latest:
          type: string
          description: The newest release; empty until the release check has run.
        available:
          type: boolean
          description: latest is newer than current.
        checked_at:
          type: string
          format: date-time
          nullable: true
        check_error:
          type: string
          description: Why the last release check failed; empty when it didn't.
        notes_url:
          type: string
          description: The newest release's notes; empty without one.
        since:
          type: string
          format: date-time
          nullable: true
          description: When the running release was installed or upgraded to.
        run:
          allOf:
            - $ref: '#/components/schemas/UpgradeRun'
          nullable: true
          description: The upgrade in progress, or the last one; null before the first.
        dumps:
          type: integer
          description: The database dumps toft keeps from before upgrades (the last 3).
        last_dump_at:
          type: string
          format: date-time
          nullable: true
          description: When the newest of them was saved; null without one.
    UpgradeRun:
      type: object
      required: [to, from, started_at, finished_at, step, outcome, error, output, notes]
      properties:
        to:
          type: string
        from:
          type: string
          description: Empty for the first install.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        step:
          type: string
          enum: [starting, preflight, pull, save, migrate, restart, health]
        outcome:
          type: string
          enum: [running, succeeded, rolled_back, failed]
        error:
          type: string
        output:
          type: array
          items:
            type: string
          description: What toft upgrade printed, line by line.
        notes:
          type: object
          additionalProperties:
            type: string
          description: Facts of the steps, by step, as toft upgrade wrote them ("38 GB free", "2 images", "1 MiB", "nothing dropped", "6 s"); a step may have none.
    StartUpgradeInput:
      type: object
      required: [to, password]
      properties:
        to:
          type: string
          maxLength: 64
          description: The newest release, as latest says it.
        password:
          type: string
          maxLength: 256
    Watchdog:
      type: object
      required: [url, last_ping_at, last_status, last_error, held]
      properties:
        url:
          type: string
          description: Empty while the watchdog is off.
        last_ping_at:
          type: string
          format: date-time
          nullable: true
          description: Since the panel last started; null before its first ping.
        last_status:
          type: integer
          nullable: true
          description: The HTTP status the URL answered; null without one.
        last_error:
          type: string
        held:
          type: boolean
          description: The last ping was held back because the panel wasn't healthy, so the watchdog notices.
    WatchdogInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: An https:// URL, or empty to turn the watchdog off.
    PanelStatus:
      type: object
      required: [version, healthy, containers, certificate, uptime_seconds, shell]
      properties:
        shell:
          type: boolean
          description: The host shell on the panel's server is on; TOFT_PANEL_HOST_SHELL=off turns it off.
        uptime_seconds:
          type: integer
          format: int64
          description: The host's; 0 until the panel has read it.
        version:
          type: string
          description: The release the panel runs; "dev" for a build that is not one.
        healthy:
          type: boolean
          description: Every container runs, and none is unhealthy or starting.
        containers:
          type: array
          items:
            $ref: '#/components/schemas/PanelContainer'
        certificate:
          allOf:
            - $ref: '#/components/schemas/PanelCertificate'
          nullable: true
          description: Null while the panel has no domain, or when its certificate can't be read.
    PanelContainer:
      type: object
      required: [name, role, image, state, health, started_at, restarts, cpu_percent, memory_bytes, memory_limit_bytes]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [api, web, database, proxy, git]
        image:
          type: string
        state:
          type: string
          description: Docker's (running, restarting, exited, …), or missing.
        health:
          type: string
          description: healthy, unhealthy or starting; empty without a health check.
        started_at:
          type: string
          format: date-time
          nullable: true
        restarts:
          type: integer
        cpu_percent:
          type: number
          nullable: true
          description: Live, while it runs.
        memory_bytes:
          type: integer
          format: int64
          nullable: true
        memory_limit_bytes:
          type: integer
          format: int64
          nullable: true
    PanelCertificate:
      type: object
      required: [domain, issuer, not_after, ask]
      properties:
        domain:
          type: string
        issuer:
          type: string
          description: The issuer's organisation (Let's Encrypt), or its common name.
        not_after:
          type: string
          format: date-time
        ask:
          allOf:
            - $ref: '#/components/schemas/PanelCertificateAsk'
          nullable: true
          description: While the domain serves Traefik's own certificate (or a restored panel waits for its domain), why Let's Encrypt hasn't issued one and when Toft has Traefik ask again. Null otherwise, and until the panel has looked (it does every minute).
    PanelCertificateAsk:
      type: object
      required: [reaches_panel, addresses, last_try_at, next_ask_at, error]
      properties:
        reaches_panel:
          type: boolean
          description: The domain reaches this panel over HTTPS. Toft asks only then.
        addresses:
          type: array
          items:
            type: string
          description: What the domain resolves to; empty without a DNS record.
        last_try_at:
          type: string
          format: date-time
          nullable: true
          description: The last time Traefik asked Let's Encrypt that Toft knows of (Traefik's start, a failure in its log, or Toft's own ask).
        next_ask_at:
          type: string
          format: date-time
          nullable: true
          description: When Toft has Traefik ask again; null while the domain doesn't reach this panel. Never before a rate limit's end.
        error:
          type: object
          nullable: true
          required: [type, detail, at, retry_after]
          description: Let's Encrypt's answer to the last try that failed, from Traefik's log.
          properties:
            type:
              type: string
              enum: [connection, unauthorized, dns, caa, rate_limited, other]
              description: connection (port 80 doesn't reach this server), unauthorized (something else answered the check), dns, caa, rate_limited, or other.
            detail:
              type: string
              description: Let's Encrypt's own words, at most 300 characters.
            at:
              type: string
              format: date-time
            retry_after:
              type: string
              format: date-time
              nullable: true
              description: With rate_limited, when Let's Encrypt takes the domain again.
    PanelServer:
      type: object
      required: [cpus, memory_total_bytes, disk_total_bytes, uptime_seconds, os, kernel, docker_version, now, samples, disk, database, system]
      properties:
        cpus:
          type: integer
        memory_total_bytes:
          type: integer
          format: int64
        disk_total_bytes:
          type: integer
          format: int64
          description: The filesystem Docker keeps its data on.
        uptime_seconds:
          type: integer
          format: int64
        os:
          type: string
        kernel:
          type: string
        docker_version:
          type: string
        now:
          allOf:
            - $ref: '#/components/schemas/PanelUsage'
          nullable: true
          description: Null until the panel has read its host twice, 5 seconds after it starts.
        samples:
          type: array
          items:
            $ref: '#/components/schemas/PanelSample'
        disk:
          allOf:
            - $ref: '#/components/schemas/PanelDisk'
          nullable: true
          deprecated: true
          description: Deprecated since v0.33.0 (D-135); GET /api/v1/instance/panel/disk replaces it and it goes in a later release. Null until Docker has answered once (it sizes every volume, so the first read can take seconds), or when it couldn't say.
        database:
          allOf:
            - $ref: '#/components/schemas/PanelDatabase'
          nullable: true
        system:
          allOf:
            - $ref: '#/components/schemas/PanelSystem'
          nullable: true
          description: Null until the host has been read; it is read every 10 minutes.
    PanelSystem:
      type: object
      required: [firewall, security_updates, filesystem]
      description: What the host says of itself - its firewall (toft-firewall, D-37), its security updates (unattended-upgrades) and the filesystem holding /.
      properties:
        firewall:
          type: string
          description: The unit's ActiveState (active, inactive, failed, ...), missing when it isn't installed, or empty when systemd didn't say.
        security_updates:
          type: string
          description: As firewall, for unattended-upgrades.
        filesystem:
          type: string
          description: The device and type holding /, as "/dev/sda1 ext4"; empty when findmnt didn't say.
    PanelUsage:
      type: object
      required: [cpu_percent, load_1, load_5, load_15, memory_used_bytes, memory_cache_bytes, swap_total_bytes, swap_used_bytes, disk_used_bytes, disk_free_bytes]
      properties:
        cpu_percent:
          type: number
        load_1:
          type: number
        load_5:
          type: number
        load_15:
          type: number
        memory_used_bytes:
          type: integer
          format: int64
        memory_cache_bytes:
          type: integer
          format: int64
        swap_total_bytes:
          type: integer
          format: int64
        swap_used_bytes:
          type: integer
          format: int64
        disk_used_bytes:
          type: integer
          format: int64
        disk_free_bytes:
          type: integer
          format: int64
          description: What df calls Available; the blocks reserved for root are neither used nor free.
    PanelSample:
      type: object
      required: [at, cpu_percent, cpu_peak, memory_used_bytes, disk_used_bytes]
      properties:
        at:
          type: string
          format: date-time
        cpu_percent:
          type: number
          description: The bucket's average in a day's or a week's range.
        cpu_peak:
          type: number
          description: The bucket's busiest minute.
        memory_used_bytes:
          type: integer
          format: int64
        disk_used_bytes:
          type: integer
          format: int64
    PanelDisk:
      type: object
      required: [images, images_unused, images_bytes, volumes_bytes, build_cache_bytes, containers_bytes]
      properties:
        images:
          type: integer
        images_unused:
          type: integer
          description: Images no container uses.
        images_bytes:
          type: integer
          format: int64
        volumes_bytes:
          type: integer
          format: int64
        build_cache_bytes:
          type: integer
          format: int64
        containers_bytes:
          type: integer
          format: int64
    PanelDatabase:
      type: object
      required: [version, size_bytes, connections, max_connections]
      properties:
        version:
          type: string
        size_bytes:
          type: integer
          format: int64
        connections:
          type: integer
        max_connections:
          type: integer
    PanelHost:
      type: object
      required: [address, cpu_cores, memory_bytes, disk_bytes, app_networks, os, role, control_plane_subnet, app_address_pool, app_address_pools, reservation, version]
      properties:
        version:
          type: string
          description: The release the panel runs (D-61); "dev" for a build that is not one.
        reservation:
          type: object
          description: D-62's fixed reservation on a server that runs the panel and apps (D-26), what it leaves the apps, and the least a server needs for it.
          required: [min_cpu, min_memory_bytes, system_cpu, system_memory_bytes, panel_cpu, panel_memory_bytes, apps_cpu, apps_memory_bytes, apps_allocated_memory_bytes, enforced]
          properties:
            min_cpu:
              type: integer
              description: The fewest vCPU a server needs to run the panel and apps (D-66).
            min_memory_bytes:
              type: integer
              description: The least memory a server needs to run the panel and apps, as the kernel reports it (D-132); a server sold as 4 GB passes.
            system_cpu:
              type: number
            system_memory_bytes:
              type: integer
            panel_cpu:
              type: number
            panel_memory_bytes:
              type: integer
            apps_cpu:
              type: number
            apps_memory_bytes:
              type: integer
            apps_allocated_memory_bytes:
              type: integer
              format: int64
              description: What every workspace's running services on the panel's server reserve of apps_memory_bytes (their memory limits). A deploy that would take it past apps_memory_bytes is refused (409 capacity_exceeded); past it a service can be killed for memory before it reaches its own limit.
            enforced:
              type: boolean
              description: Apps here run under toft-apps.slice, which holds them to apps_cpu and apps_memory_bytes; false on installs without it.
        control_plane_subnet:
          type: string
          description: The control plane's network (paas-network), as Docker reports it.
        app_address_pool:
          type: string
          deprecated: true
          description: Deprecated since v0.36.0; app_address_pools replaces it and it goes in a later release. The first of app_address_pools' bases (10.203.0.0/16); empty when there is none.
        app_address_pools:
          type: array
          nullable: true
          description: Docker's default-address-pools on this host, which each environment's network takes its subnet from; empty when it has none (Docker's own ranges), null when Docker didn't say.
          items:
            type: object
            required: [base, size]
            properties:
              base:
                type: string
                description: An IPv4 CIDR (10.203.0.0/16).
              size:
                type: integer
                description: Each network's prefix length (24).
        os:
          type: string
          description: The host's operating system, as Docker reports it.
        role:
          type: string
          enum: [apps, control_plane]
        address:
          type: string
        cpu_cores:
          type: integer
        memory_bytes:
          type: integer
        disk_bytes:
          type: integer
        app_networks:
          type: string
    Setup:
      type: object
      required: [in_progress, domain, domain_set, awaiting_domain, role, role_set, kit_acknowledged_at, kit_out_of_date, finished_at, app]
      properties:
        in_progress:
          type: boolean
          description: Started by the first account and not finished; operators are sent to the next required step.
        domain:
          type: string
          description: The panel's domain; empty while it answers on the IP address.
        domain_set:
          type: boolean
          description: The panel address step was answered (a domain, or keep the IP).
        awaiting_domain:
          type: boolean
          description: This panel was restored from a backup and its domain has not come back to it, so beside the domain it also answers on its server's IP address, with a certificate browsers don't trust (D-163). It ends by itself once the domain reaches this panel with a trusted certificate, which the panel looks for every minute, or when an operator saves the address again (PUT /api/v1/instance/setup/domain). False on a panel that was never restored, on one with no domain, and during setup.
        role:
          type: string
          enum: [apps, control_plane]
          description: apps is Run apps here too (one server, D-26); control_plane is Only Toft and runs no apps on the panel host.
        role_set:
          type: boolean
        kit_acknowledged_at:
          type: string
          format: date-time
          nullable: true
        kit_out_of_date:
          type: boolean
          description: The kit was acknowledged, and the encryption key or the panel host's backup repository, repository password or access key changed since, so a restore with the stored kit fails (D-163). False until a kit is acknowledged, and again once the current one is. A kit acknowledged before fingerprints were kept counts as out of date when the panel host has a backup destination. Stopping the panel host's backups doesn't make it out of date, since the stored kit still opens the copies in the bucket.
        finished_at:
          type: string
          format: date-time
          nullable: true
        app:
          type: string
          description: The catalog template the installer was asked to open after setup (--app, D-61); empty for none.
    SetupPatch:
      type: object
      description: Exactly one of kit_acknowledged or finished. Backups, servers and invites left the wizard for Home's checklist (7g); skip is gone.
      properties:
        kit_acknowledged:
          type: boolean
          enum: [true]
        fingerprint:
          type: string
          maxLength: 64
          description: Required with kit_acknowledged. RecoveryKit.fingerprint of the kit the operator stored. The acknowledgement goes to the instance audit log as recovery_kit.stored, with neither the kit nor the fingerprint.
        finished:
          type: boolean
          enum: [true]
        domain_checked:
          type: boolean
          description: With finished, the operator has opened the panel's domain and it works, so it isn't probed. The probe can fail where the domain works, on a server that can't reach its own public address or behind a CDN.
    PanelDomainInput:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          maxLength: 253
          description: A host name such as panel.example.com; empty keeps the panel on the IP address.
    SetPanelDomainInput:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          maxLength: 253
          description: A host name such as panel.example.com; empty keeps the panel on the IP address.
        domain_checked:
          type: boolean
          description: The operator says the domain works, so it isn't probed. The probe can fail where the domain works, on a server that can't reach its own public address or behind a CDN.
    PanelDomainCheck:
      type: object
      required: [domain, addresses, reaches_panel, certificate]
      properties:
        domain:
          type: string
        addresses:
          type: array
          items:
            type: string
          description: What the domain resolves to (A and AAAA).
        reaches_panel:
          type: boolean
          description: A request to https://<domain>/api/v1/instance/probe came back to this panel.
        certificate:
          type: object
          required: [state, expires_at, issuer]
          properties:
            state:
              type: string
              enum: [none, pending, issued]
              description: none while the domain isn't the panel's; pending until a trusted certificate is served.
            expires_at:
              type: string
              format: date-time
              nullable: true
            issuer:
              type: string
    ServerRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [apps, control_plane]
    RecoveryKit:
      type: object
      required: [filename, text, domain, version, encryption_key, backup, restore_command, fingerprint]
      properties:
        filename:
          type: string
        text:
          type: string
          description: The whole kit as a text file.
        domain:
          type: string
        version:
          type: string
        encryption_key:
          type: string
        backup:
          type: object
          nullable: true
          required: [repository, password, access_key]
          properties:
            repository:
              type: string
            password:
              type: string
            access_key:
              type: string
        restore_command:
          type: string
        fingerprint:
          type: string
          description: Names what this kit restores (the encryption key and the backup lines) without holding any of it. Sent back in SetupPatch.fingerprint when the kit is acknowledged.
    Probe:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Random, minted when the backend starts.
    CreateWorkspaceInput:
