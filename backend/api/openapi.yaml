          application/json:
            schema:
              $ref: '#/components/schemas/DiskPolicyInput'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DiskPolicy'
                required:
                  - data
                type: object
          description: OK.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel/gvisor:
    get:
      tags: [Instance]
      operationId: getInstancePanelGvisor
      summary: The last gVisor install on the panel's own server (D-97); operators only
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GvisorRun'
                    nullable: true
                required:
                  - data
                type: object
          description: The run, or null before the first one.
        "403":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Instance]
      operationId: installInstancePanelGvisor
      summary: Install gVisor's runsc on the panel's own server and register it with Docker (D-97)
      description: "Instance operators, with X-Toft-Reauth (403 reauth_required; session_required for an API key); allowed with TOFT_PANEL_HOST_SHELL=off. The install of POST /servers/{serverID}/gvisor, the same steps and events, run on the host through the panel's host helper instead of SSH: server-sent events with each step's output, then event done or event error; it carries on when the client leaves, and is recorded (GET …/gvisor). The panel's containers and the apps there keep running. 400 panel_control_plane_only when the panel's server is Only Toft; 400 gvisor_unsupported when its last probe says gVisor can't run there; 409 install_running while one runs. Written to the instance audit log as panel.gvisor_installed or panel.gvisor_install_failed."
      parameters:
        - name: X-Toft-Reauth
          in: header
          required: true
          description: The proof from POST /api/v1/auth/reauth.
          schema:
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: A stream; see the description.
        "400":
          $ref: '#/components/responses/Problem'
        "403":
          $ref: '#/components/responses/Problem'
        "409":
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/instance/panel-host:
