      required: [state, total, passed, failed, pending]
      properties:
        state:
          type: string
          enum: [success, failure, pending]
        total:
          type: integer
        passed:
          type: integer
          description: Succeeded or skipped.
        failed:
          type: integer
          description: Failed or cancelled.
        pending:
          type: integer
          description: Pending or running.
    CommitCheck:
      type: object
      required: [name, state, description, details_url, deployment, reporter, started_at, completed_at, created_at, updated_at]
      properties:
        name:
          type: string
          description: "Unique on its commit. Toft's own are toft/deploy/<environment>/<service>."
        state:
