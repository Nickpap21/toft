# Uptime Kuma 2 (Toft catalog, D-147). Docker monitoring is off: Toft's
# deploy policy refuses the Docker socket.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    restart: unless-stopped
    volumes:
      - data:/app/data
    mem_limit: 512m

volumes:
  data:
